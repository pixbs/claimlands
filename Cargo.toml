# Claimlands — workspace root.
#
# The dependency direction between these crates IS the isolation guarantee that
# lets many agents work in parallel. See docs/architecture.md §3 and deny.toml.
# No crate may ever add an edge pointing back toward `lands-core`.

[workspace]
resolver = "3"
members = [
    "crates/lands-rules",
    "crates/lands-core",
    "crates/lands-worldgen",
    "crates/lands-ai",
    "crates/lands-procgen",
    "crates/lands-render",
    "crates/lands-levels",
    "crates/lands-app",
    "crates/lands-ffi",
    "crates/lands-testkit",
    "tools/lands-cli",
    "tools/level-editor",
    "platforms/desktop",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
# No `license` field: these crates are unpublished (`publish = false`) and are
# not distributed as source, so there is nothing to license. "UNLICENSED" is an
# npm convention, not a valid SPDX expression, and cargo-deny rejects it.
publish = false

[workspace.dependencies]
lands-rules    = { path = "crates/lands-rules" }
lands-core     = { path = "crates/lands-core" }
lands-worldgen = { path = "crates/lands-worldgen" }
lands-ai       = { path = "crates/lands-ai" }
lands-procgen  = { path = "crates/lands-procgen" }
lands-render   = { path = "crates/lands-render" }
lands-levels   = { path = "crates/lands-levels" }
lands-app      = { path = "crates/lands-app" }
lands-testkit  = { path = "crates/lands-testkit" }

serde    = { version = "1", default-features = false, features = ["derive", "alloc", "rc"] }
ron      = "0.8"
thiserror = "2"
clap     = { version = "4", features = ["derive"] }
proptest = "1"

# Release profile targets mobile: small binary, full optimisation.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Tests must run fast enough that the golden-replay corpus can be enormous.
[profile.test]
opt-level = 2

[profile.bench]
lto = "thin"
