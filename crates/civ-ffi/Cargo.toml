[package]
name = "civ-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# The shells link this, so it must actually build as a library each platform
# can consume — a `staticlib` for the iOS shell, a `cdylib` for the Android
# one. Without these, the mobile CI job would happily build an rlib and prove
# nothing about whether the FFI surface links.
#
# `rlib` stays so the rest of the workspace (and `cargo test`) can depend on it
# normally.
[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
civ-app = { workspace = true }
