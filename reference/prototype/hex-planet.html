<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Hex Planet — step 01</title>
<style>
  :root{
    --deep:#0e0b16;
    --panel:rgba(27,22,38,.82);
    --line:#2f2740;
    --text:#ece4d4;
    --muted:#8b809c;
    --gold:#f2b45c;
    --teal:#58c2b0;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:#030209;
    color:var(--text);font-family:var(--mono);overflow:hidden;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  }
  #stage{position:fixed;inset:0}
  canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;cursor:grab}
  canvas.dragging{cursor:grabbing}

  .panel{
    position:fixed;background:var(--panel);border:1px solid var(--line);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  }
  .lbl{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}

  /* readout */
  #readout{top:12px;left:12px;padding:9px 12px 10px;min-width:150px}
  #readout h1{font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:500}
  #readout h1 span{color:var(--muted)}
  #stats{margin-top:7px;display:grid;grid-template-columns:auto auto;gap:2px 14px;font-size:11px}
  #stats b{font-weight:500;color:var(--gold);justify-self:end;font-variant-numeric:tabular-nums}
  #tileline{margin-top:7px;padding-top:7px;border-top:1px solid var(--line);font-size:11px;color:var(--teal);min-height:15px}
  #tileline em{color:var(--muted);font-style:normal}

  /* controls */
  #controls{left:12px;right:12px;bottom:12px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:14px 22px;align-items:center}
  .ctrl{display:flex;align-items:center;gap:8px}
  .ctrl .lbl{white-space:nowrap}
  .seg{display:flex;border:1px solid var(--line)}
  .seg button{
    font:inherit;font-size:11px;color:var(--muted);background:none;border:0;
    padding:4px 9px;cursor:pointer;border-right:1px solid var(--line);
  }
  .seg button:last-child{border-right:0}
  .seg button:hover{color:var(--text)}
  .seg button[aria-pressed="true"]{background:var(--gold);color:#1a1204}
  .seg button:focus-visible{outline:2px solid var(--teal);outline-offset:-2px}

  .btn{
    font:inherit;font-size:11px;color:var(--muted);background:none;
    border:1px solid var(--line);padding:4px 9px;cursor:pointer;
  }
  .btn:hover{color:var(--text);border-color:var(--muted)}
  .btn:focus-visible{outline:2px solid var(--teal);outline-offset:1px}

  input[type=range]{
    -webkit-appearance:none;appearance:none;background:none;
    width:150px;height:16px;cursor:ew-resize;
  }
  input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--line)}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:8px;height:14px;margin-top:-6px;
    background:var(--gold);border:0;border-radius:0;
  }
  input[type=range]::-moz-range-track{height:2px;background:var(--line)}
  input[type=range]::-moz-range-thumb{width:8px;height:14px;background:var(--gold);border:0;border-radius:0}
  input[type=range]:focus-visible{outline:2px solid var(--teal);outline-offset:3px}
  #freq-out{
    font-size:11px;color:var(--gold);font-variant-numeric:tabular-nums;
    min-width:62px;letter-spacing:.04em;
  }
  #freq-out i{color:var(--muted);font-style:normal}
  #hint{margin-left:auto;font-size:10px;color:var(--muted);letter-spacing:.06em}
  /* The panels are instrumentation, not the game: hidden until asked for. */
  #readout,#controls{display:none}
  body.dbg #readout{display:block}
  body.dbg #controls{display:flex}
  #dbg{
    position:fixed;top:12px;right:12px;width:28px;height:28px;z-index:5;
    padding:0;display:flex;align-items:center;justify-content:center;
    background:var(--panel);backdrop-filter:blur(6px);
  }
  #dbg svg{width:12px;height:12px;shape-rendering:crispEdges}
  #dbg[aria-pressed="true"]{background:var(--gold);color:#1a1204;border-color:var(--gold)}

  /* Painting tools sit clear of both panels, so showing the debug UI never
     covers them and they never have to move. */
  #tools{
    position:fixed;left:12px;top:50%;transform:translateY(-50%);z-index:5;
    display:flex;flex-direction:column;gap:8px;
  }
  .tool{
    width:40px;height:40px;padding:0;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    color:var(--muted);background:var(--panel);border:1px solid var(--line);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  }
  .tool svg{width:22px;height:22px;shape-rendering:crispEdges}
  .tool:hover{color:var(--text);border-color:var(--muted)}
  .tool[aria-pressed="true"]{background:var(--gold);color:#1a1204;border-color:var(--gold)}
  .tool:focus-visible{outline:2px solid var(--teal);outline-offset:1px}

  @media (max-width:640px){
    #controls{gap:10px 16px;padding:9px 10px}
    #hint{display:none}
    #readout{min-width:0}
  }
</style>
</head>
<body>
<div id="stage"></div>

<button id="dbg" class="btn" aria-pressed="false" title="Debug panel">
  <svg viewBox="0 0 12 12"><path fill="currentColor" d="M1 2h10v1H1zM1 5h10v1H1zM1 8h10v1H1z"/></svg>
</button>

<div id="tools">
  <button class="tool" data-mode="fields" title="Fields" aria-pressed="false">
    <svg viewBox="0 0 12 12"><path fill="currentColor" opacity=".55" d="M1 2h10v2H1z"/><path fill="currentColor" d="M1 5h10v2H1z"/><path fill="currentColor" opacity=".55" d="M1 8h10v2H1z"/></svg>
  </button>
  <button class="tool" data-mode="forest" title="Forest" aria-pressed="false">
    <svg viewBox="0 0 12 12"><path fill="currentColor" d="M4 1h1v1H4zM3 2h3v1H3zM2 3h5v1H2zM1 4h7v1H1zM4 5h1v5H4z"/><path fill="currentColor" opacity=".62" d="M9 4h1v1H9zM8 5h3v1H8zM7 6h5v1H7zM9 7h1v3H9z"/></svg>
  </button>
  <button class="tool" data-mode="houses" title="Town" aria-pressed="false">
    <svg viewBox="0 0 12 12"><path fill="currentColor" d="M6 1h1v1H6zM5 2h3v1H5zM4 3h5v1H4zM3 4h7v1H3zM2 5h9v1H2z"/><path fill="currentColor" opacity=".62" d="M3 6h7v5H3z"/></svg>
  </button>
</div>

<div class="panel" id="readout">
  <h1>Hex planet <span>/ 01</span></h1>
  <div id="stats">
    <div class="lbl">Tiles</div><b id="s-tiles">—</b>
    <div class="lbl">Hex / Pent</div><b id="s-mix">—</b>
    <div class="lbl">Around</div><b id="s-around">—</b>
    <div class="lbl">Land / Sea</div><b id="s-land">—</b>
    <div class="lbl">Field tiles</div><b id="s-field">0</b>
    <div class="lbl">Parcels</div><b id="s-parcel">0</b>
    <div class="lbl">Wood tiles</div><b id="s-wood">0</b>
    <div class="lbl">Town tiles</div><b id="s-town">0</b>
    <div class="lbl">Territory</div><b id="s-terr">0</b>
  </div>
  <div id="tileline"><em>Point at a tile</em></div>
</div>

<div class="panel" id="controls">
  <div class="ctrl">
    <span class="lbl">Hex size</span>
    <input type="range" id="freq" min="2" max="12" step="1" value="8"
           aria-label="Hex size — drag right for more, smaller tiles">
    <span id="freq-out">642 <i>tiles</i></span>
  </div>
  <div class="ctrl"><span class="lbl">Pixel size</span><div class="seg" id="seg-px"></div></div>
  <div class="ctrl"><span class="lbl">Air</span><div class="seg" id="seg-air"></div></div>
  <div class="ctrl"><span class="lbl">Clouds</span><div class="seg" id="seg-cloud"></div></div>
  <div class="ctrl"><span class="lbl">Edges</span><div class="seg" id="seg-edge"></div></div>
  <div class="ctrl"><span class="lbl">Drift</span><div class="seg" id="seg-spin"></div></div>
  <div class="ctrl"><span class="lbl">Click</span><div class="seg" id="seg-mode"></div></div>
  <div class="ctrl">
    <button class="btn" id="regen">New continents</button>
    <button class="btn" id="clear">Clear territory</button>
    <button class="btn" id="clear-cover">Clear cover</button>
  </div>
  <div id="hint">drag to rotate · scroll to zoom · click a tile</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ============================================================================
   1. HEX SPHERE GEOMETRY  (Goldberg polyhedron = dual of a geodesic icosahedron)
   Pure math, no renderer types — portable to wgpu/Rust later.
   A frequency-n sphere always yields 10n^2+2 tiles: exactly 12 pentagons,
   the rest hexagons.
   ========================================================================== */
const V = {
  sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],
  add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],
  mul:(a,s)=>[a[0]*s,a[1]*s,a[2]*s],
  dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
  cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
  len:a=>Math.hypot(a[0],a[1],a[2]),
  norm(a){const l=this.len(a)||1;return [a[0]/l,a[1]/l,a[2]/l];}
};

function icosahedron(){
  const t=(1+Math.sqrt(5))/2;
  const v=[[-1,t,0],[1,t,0],[-1,-t,0],[1,-t,0],[0,-1,t],[0,1,t],
           [0,-1,-t],[0,1,-t],[t,0,-1],[t,0,1],[-t,0,-1],[-t,0,1]].map(p=>V.norm(p));
  const f=[[0,11,5],[0,5,1],[0,1,7],[0,7,10],[0,10,11],
           [1,5,9],[5,11,4],[11,10,2],[10,7,6],[7,1,8],
           [3,9,4],[3,4,2],[3,2,6],[3,6,8],[3,8,9],
           [4,9,5],[2,4,11],[6,2,10],[8,6,7],[9,8,1]];
  return {v,f};
}

/* Subdivide every icosahedron face into n^2 triangles, project onto the sphere. */
function geodesic(n){
  const base=icosahedron(), verts=[], index=new Map(), tris=[];
  const key=p=>p.map(x=>(Math.abs(x)<1e-9?0:x).toFixed(6)).join(',');
  const push=p=>{const k=key(p);let i=index.get(k);
    if(i===undefined){i=verts.length;index.set(k,i);verts.push(p);}return i;};

  for(const [ia,ib,ic] of base.f){
    const A=base.v[ia],B=base.v[ib],C=base.v[ic],g=[];
    for(let i=0;i<=n;i++){
      g[i]=[];
      for(let j=0;j<=n-i;j++){
        const w=n-i-j;
        g[i][j]=push(V.norm([(A[0]*w+B[0]*i+C[0]*j)/n,
                             (A[1]*w+B[1]*i+C[1]*j)/n,
                             (A[2]*w+B[2]*i+C[2]*j)/n]));
      }
    }
    for(let i=0;i<n;i++) for(let j=0;j<n-i;j++){
      tris.push([g[i][j],g[i+1][j],g[i][j+1]]);
      if(j<n-i-1) tris.push([g[i+1][j],g[i+1][j+1],g[i][j+1]]);
    }
  }
  return {verts,tris};
}

/* The dual: every geodesic vertex becomes one tile. */
function buildHexSphere(n){
  const {verts,tris}=geodesic(n);
  const around=verts.map(()=>[]), nbr=verts.map(()=>new Set());
  tris.forEach((t,ti)=>{
    for(let k=0;k<3;k++){
      around[t[k]].push(ti);
      nbr[t[k]].add(t[(k+1)%3]); nbr[t[k]].add(t[(k+2)%3]);
    }
  });
  const centroid=tris.map(t=>V.norm(V.add(V.add(verts[t[0]],verts[t[1]]),verts[t[2]])));

  return verts.map((c,i)=>{
    const fan=around[i].map(ti=>({ti,p:centroid[ti]}));
    // Tangent frame with e1 aimed at the first corner, so each tile's texture
    // keeps a stable orientation relative to its own geometry.
    const e1=V.norm(V.sub(fan[0].p,V.mul(c,V.dot(fan[0].p,c))));
    const e2=V.cross(c,e1);                       // (e1,e2,c) is right-handed
    fan.forEach(o=>{o.a=Math.atan2(V.dot(o.p,e2),V.dot(o.p,e1));});
    fan.sort((x,y)=>x.a-y.a);                     // CCW seen from outside
    const corners=fan.map(o=>o.p);

    /* Which tile sits across edge k (corner k -> corner k+1)? Consecutive
       corners are centroids of two geodesic triangles that share edge (i,j),
       so j is the vertex those triangles have in common besides i. This is
       what lets a territory draw one outline instead of six per tile. */
    const edgeNeighbors=fan.map((o,k)=>{
      const A=tris[o.ti], B=tris[fan[(k+1)%fan.length].ti];
      for(const v of A) if(v!==i && B.indexOf(v)>=0) return v;
      return -1;
    });

    /* The three tiles meeting at each corner. A corner is the centroid of one
       geodesic triangle, and that triangle's three vertices ARE those tiles. */
    const cornerTiles=fan.map(o=>tris[o.ti]);

    return {
      id:i, center:c, corners, e1, e2, edgeNeighbors, cornerTiles,
      sides:corners.length,
      neighbors:[...nbr[i]],
      // --- gameplay slots, filled in by later steps ---
      // cover is the tile TYPE laid over the ground: null | 'fields' | 'forest'
      // | 'houses'. One per tile, mutually exclusive. Only 'fields' has art yet.
      owner:null, terrain:'land', cover:null, building:0, capital:false
    };
  });
}

/* ============================================================================
   2. SHARED STRIPS  —  the cliff and surf sprites. Neither the ground nor the
   air lives here: every land and sea tile gets its own cell in a per-tile atlas
   (section 3b) so the grass never repeats, and the air is one flat colour.
   Drawn per-texel so it is true pixel art, not a scaled vector shape.
   Swap these for loadTexture('tiles.png') once real art exists.
   ========================================================================== */
const TILE_PX = 24;
const CLIFF_W = 24, CLIFF_H = 4;   // the wall is exactly 4 texture pixels tall

// cliff rows, top row first: bare soil under the grass, down into wet sand.
// The old top row was green, which read as a second stripe of grass.
const CLIFF_ROWS = ['#5a4a2e','#7d6a45','#a08a5f','#bda677'];
const FOAM_ROWS  = ['#ffffff','#eaf6ff','#d3e8f7','#bcd9ee'];
/* Coast widths, in texture pixels. FOAM_H tracks FOAM_PX so the surf texels
   stay square: widen the band without widening the sprite and they stretch. */
const BEACH_PX = 3;          // how far the coast slope runs out over the water
const FOAM_PX  = 7;          // width of the surf band beyond the slope
const FOAM_W = 24, FOAM_H = FOAM_PX, FOAM_FRAMES = 8;

/* Ground bands, dark to light. Quantising a smooth field into these, with a
   dithered band edge, is what gives the patchwork look. */
const GRASS_BANDS = ['#3f7d34','#5aa444','#7cc255'];   // shadow, mid, highlight
/* Ground under a village: grass walked off into bare earth. Middle band is the
   asked-for tone exactly; the other two are it darkened and lifted, so the mud
   takes the same noise and dither as the grass and does not read as a flat
   sticker dropped on the hex. */
const MUD_BANDS = ['#a18a5b','#c9ac72','#ddbd7d'];
/* The edge of the bare earth is decided by noise, the same way the grass bands,
   the shoal and the clouds are: a built-up field is compared against a noise
   field, so the boundary breaks up into patches and stray flecks instead of
   stopping dead on a hex border. Fine scale on purpose — a few world px, well
   under a tile — because this is a fringe, not a biome. */
const MUD_OCT = 3, MUD_F0 = 30;
const MUD_SALT = 8681;     // its own stream, uncorrelated with the grass
const MUD_EDGE = 0.42;     // how far out the earth reaches before noise decides
const MUD_SCATTER = 0.34;  // how hard the noise pushes that line about
const MUD_DITHER = 0.06;   // per-texel speckle, as the grass bands get
const SEA_BANDS   = ['#123659','#1a4d78','#246698','#3184b0','#46a2c2']; // deep..shallow
const GRASS_OCT = 4, GRASS_F0 = 5.5;     // patch scale: ~2 tiles across
const SEA_OCT   = 2, SEA_F0   = 3.0;
const GRASS_DITHER = 0.025;  // near-hard band edges; 0 gives vector-clean contours
const SPECKLE      = 0.04;   // lone lighter flecks, like grass catching light
/* The darkest band is driven onto the shoreline itself. A corner counts as
   coastal if any of the three tiles meeting there is water; the value then
   falls off to nothing at the tile centre, so the dark tone is a rim hugging
   the water rather than a wash over every tile near it. */
const COAST_DARKEN = 0.80, COAST_TIGHT = 2.2;
/* The sea gets the mirror treatment, but over a wider zone: water shoals toward
   land across several tiles, so it reads as shelf giving way to deep ocean. */
const SEA_FADE = 3, SEA_SHALLOW = 0.60;

function hash2(x,y){const s=Math.sin(x*127.1+y*311.7)*43758.5453;return s-Math.floor(s);}

function polyEdges(sides,R){
  const pts=[];
  for(let k=0;k<sides;k++){
    const a=k/sides*Math.PI*2;
    pts.push([Math.cos(a)*R,Math.sin(a)*R]);
  }
  return pts.map((p,k)=>{
    const q=pts[(k+1)%sides];
    const nx=q[1]-p[1], ny=-(q[0]-p[0]);          // outward normal, so d-n·x > 0 inside
    const l=Math.hypot(nx,ny)||1;
    return {nx:nx/l, ny:ny/l, d:(nx/l)*p[0]+(ny/l)*p[1]};
  });
}

const rgb=hex=>[parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)];

function pixelTexture(cv,wrap){
  const tex=new THREE.CanvasTexture(cv);
  tex.magFilter=THREE.NearestFilter;
  tex.minFilter=THREE.NearestFilter;
  tex.generateMipmaps=false;
  tex.wrapS=tex.wrapT=wrap||THREE.ClampToEdgeWrapping;
  return tex;
}

/* The cliff face. Repeats horizontally along an edge, and once vertically per
   elevation level, so a wall is always exactly CLIFF_H texture pixels per step. */
function makeCliffTexture(){
  const cv=document.createElement('canvas');
  cv.width=CLIFF_W; cv.height=CLIFF_H;
  const ctx=cv.getContext('2d');
  const img=ctx.createImageData(CLIFF_W,CLIFF_H);
  const rows=CLIFF_ROWS.map(rgb);
  for(let y=0;y<CLIFF_H;y++) for(let x=0;x<CLIFF_W;x++){
    let c=rows[y];
    // nudge some texels to a neighbouring row so the strata are not ruler-straight
    const n=hash2(x*1.7,y*3.1);
    if(y>0 && n>0.82) c=rows[y-1];
    else if(y<CLIFF_H-1 && n<0.16) c=rows[y+1];
    const o=(y*CLIFF_W+x)*4;
    img.data[o]=c[0];img.data[o+1]=c[1];img.data[o+2]=c[2];img.data[o+3]=255;
  }
  ctx.putImageData(img,0,0);
  return pixelTexture(cv,THREE.RepeatWrapping);
}

/* Surf. One sprite sheet of FOAM_FRAMES frames stacked vertically; the render
   loop animates it by moving the texture's offset, so no geometry is rebuilt.
   Row 0 of each frame is the shore side, row FOAM_H-1 the open-water side. */
function makeFoamTexture(){
  const cv=document.createElement('canvas');
  cv.width=FOAM_W; cv.height=FOAM_H*FOAM_FRAMES;
  const ctx=cv.getContext('2d');
  const img=ctx.createImageData(cv.width,cv.height);
  const rows=FOAM_ROWS.map(rgb);
  for(let f=0;f<FOAM_FRAMES;f++){
    /* The shape along the shore is FIXED; only its amplitude breathes. Putting
       the frame index inside the sine phase (as before) slides the crest
       sideways, which reads as the surf rotating around the planet. */
    const swell = 0.28 + 0.72*(0.5+0.5*Math.sin(f/FOAM_FRAMES*Math.PI*2));
    for(let x=0;x<FOAM_W;x++){
      const shape = 1.15 + 1.25*Math.sin(x*0.55)
                         + 0.75*Math.sin(x*0.23+2.1)
                         + 0.45*hash2(x*1.3, 7.7);   // fixed in time, not per frame
      const crest = shape*swell*(FOAM_H/4);   // shape was tuned at 4 rows tall
      for(let j=0;j<FOAM_H;j++){
        // with flipY, frame f occupies canvas rows (FOAM_H*(FOAM_FRAMES-1-f)) up
        const cy=FOAM_H*(FOAM_FRAMES-1-f)+j;
        const o=(cy*cv.width+x)*4;
        if(j+0.5>=crest){img.data[o+3]=0;continue;}
        const c=rows[Math.min(rows.length-1,Math.floor(j*rows.length/FOAM_H))];
        img.data[o]=c[0];img.data[o+1]=c[1];img.data[o+2]=c[2];img.data[o+3]=255;
      }
    }
  }
  ctx.putImageData(img,0,0);
  const tex=pixelTexture(cv,THREE.RepeatWrapping);
  tex.wrapT=THREE.ClampToEdgeWrapping;
  tex.repeat.set(1,1/FOAM_FRAMES);
  return tex;
}

/* ============================================================================
   3. TERRAIN  —  every tile carries an integer elevation level.
   Level 0 is the land shell at RADIUS; level -1 is the sea shell, exactly
   4 texture pixels below it. The two shells are ONE mesh: a tile is emitted
   at its own level only, so no grass facet is ever built under the sea.
   ========================================================================== */
const RADIUS = 1;
const UV_INSET = 0.94;         // keeps nearest-sampling off the atlas seam
const LEVEL_PX = 4;            // wall height, in texture pixels, per level step
const ATMO_PX  = 12;           // atmosphere shell height above the land shell
const CLOUD_PX = 8;            // lowest cloud deck above the atmosphere
/* One flat tone for the whole atmosphere, and the same tone for the glow behind
   the planet, so the rim and the halo read as one body of air. */
const AIR_COLOR = '#c3e3f6';
/* The halo hugs the atmosphere instead of filling the frame. Everything is
   measured against the ATMOSPHERE's radius, not the planet's, because that
   radius moves with the world size — 1.06 at the finest, 1.33 at the coarsest —
   and a halo pinned to the planet would sit inside the air at one end of the
   slider and far outside it at the other.
   Only the sliver past the rim is ever visible: the planet is opaque out to 1.0
   and the atmosphere shell covers the annulus from there to its own rim, so the
   glow shows as a thin ring beyond that and nothing more. */
const GLOW_OUT  = 1.16;        // how far past the atmosphere rim the glow reaches
const GLOW_BACK = 1.30;        // halo sits this many atmosphere radii behind
const GLOW_MAX  = 0.42;        // alpha at the rim, falling to nothing outward
const LAND_FRACTION = 0.42;

function mulberry32(a){
  return function(){
    a|=0; a=a+0x6D2B79F5|0;
    let t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}

/* Continents from a handful of directional waves over the sphere, then one
   smoothing pass so the coastline is not confetti. The threshold is taken as a
   quantile, which pins the land ratio no matter what the waves happen to do. */
function generateTerrain(tiles,seed){
  const rnd=mulberry32(seed), waves=[];
  for(let k=0;k<7;k++){
    const d=V.norm([rnd()*2-1,rnd()*2-1,rnd()*2-1]);
    waves.push({d,f:1.2+rnd()*4.2,p:rnd()*Math.PI*2});
  }
  const e=tiles.map(t=>{
    let s=0;
    for(const w of waves) s+=Math.sin(w.f*V.dot(t.center,w.d)*Math.PI+w.p)/w.f;
    return s;
  });
  const cut=[...e].sort((a,b)=>a-b)[Math.floor(tiles.length*(1-LAND_FRACTION))];
  tiles.forEach((t,i)=>{t.level = e[i]>cut ? 0 : -1;});

  const snapshot=tiles.map(t=>t.level);
  tiles.forEach((t,i)=>{
    const land=t.neighbors.reduce((s,j)=>s+(snapshot[j]===0?1:0),0);
    if(snapshot[i]===0 && land<=1) t.level=-1;        // lone islet
    if(snapshot[i]===-1 && land>=t.sides-1) t.level=0; // lone puddle
  });
}

/* ============================================================================
   3b. GROUND ATLAS  —  one 24x24 cell per tile, same trick as the clouds.
   Each texel is mapped back to the direction it covers and a continuous 3D
   field is sampled there, so the patchwork crosses tile borders unbroken and
   no two hexes are alike. The field is quantised into value bands, and the
   band edge is dithered with a world-space hash, which is what produces the
   stippled boundaries rather than hard contours.
   ========================================================================== */
function buildTerrainAtlas(tiles,seed,PX){
  const cols=Math.ceil(Math.sqrt(tiles.length)), rows=Math.ceil(tiles.length/cols);
  const cv=document.createElement('canvas');
  cv.width=cols*TILE_PX; cv.height=rows*TILE_PX;
  const ctx=cv.getContext('2d');
  const img=ctx.createImageData(cv.width,cv.height);
  const grass=GRASS_BANDS.map(rgb), water=SEA_BANDS.map(rgb), mud=MUD_BANDS.map(rgb);

  // the cell polygon at the radius the UVs actually reach
  const shape={5:polyEdges(5,TILE_PX/2*UV_INSET),6:polyEdges(6,TILE_PX/2*UV_INSET)};

  /* Hash lattice slightly finer than a texel, keyed on world position. Keying
     it on cell coordinates instead would restart the stipple in every hex. */
  const K=1.35/PX;

  // stretch the field across the full band range using its own spread
  const probe=(oct,f0,sd)=>{
    const a=tiles.map(t=>fbm3(t.center,sd===undefined?seed:sd,oct,f0)).sort((x,y)=>x-y);
    const lo=a[Math.floor(tiles.length*0.03)], hi=a[Math.floor(tiles.length*0.97)];
    return {lo,span:Math.max(1e-6,hi-lo)};
  };
  const gp=probe(GRASS_OCT,GRASS_F0), sp=probe(SEA_OCT,SEA_F0);
  const mp=probe(MUD_OCT,MUD_F0,seed+MUD_SALT);

  /* Held per TILE centre and per CORNER. A corner's value is a property of the
     corner itself — is any of its three tiles water — so both sides of an edge
     read the same number and the shading cannot step at a border. Tile centres
     are 0, so the rim fades out within the coastal tile instead of flooding it. */
  /* Built-up field, shaped exactly like the coast field above: one value per
     tile centre and one per CORNER, where a corner counts how many of its three
     tiles are built on. Both sides of an edge therefore read the identical
     number and the earth cannot step at a hex border — and because a corner
     shared with a village scores above zero, the bare ground spills a little way
     into whatever the village backs onto, which is what a walked fringe does. */
  function computeBuilt(){
    for(const t of tiles) t.built = t.cover==='houses' ? 1 : 0;
    for(const t of tiles) t.cornerBuilt=t.cornerTiles.map(tr=>
      ((tiles[tr[0]].cover==='houses'?1:0)+(tiles[tr[1]].cover==='houses'?1:0)+
       (tiles[tr[2]].cover==='houses'?1:0))/3);
  }

  function computeProx(){
    // land rim: binary, so the dark tone hugs the waterline and stops
    for(const t of tiles) t.prox = t.level<0 ? 1 : 0;
    for(const t of tiles) t.cornerProx=t.cornerTiles.map(
      tr=>(tiles[tr[0]].level<0||tiles[tr[1]].level<0||tiles[tr[2]].level<0)?1:0);

    // sea shelf: graph distance from land, spread over SEA_FADE tiles
    const d=new Array(tiles.length).fill(-1), q=[];
    for(const t of tiles) if(t.level>=0){d[t.id]=0;q.push(t.id);}
    for(let hd=0;hd<q.length;hd++){
      const i=q[hd];
      if(d[i]>SEA_FADE+1) continue;
      for(const j of tiles[i].neighbors) if(d[j]<0){d[j]=d[i]+1;q.push(j);}
    }
    for(const t of tiles){
      const dd=d[t.id];
      t.shallow = t.level>=0 ? 1 : (dd<0 ? 0 : Math.max(0,1-dd/SEA_FADE));
    }
    // mean, not max: the sea wants a gradient, where the land wanted a hard rim
    for(const t of tiles) t.cornerShallow=t.cornerTiles.map(
      tr=>(tiles[tr[0]].shallow+tiles[tr[1]].shallow+tiles[tr[2]].shallow)/3);
    computeBuilt();
  }
  computeProx();

  function paint(t){
    const pl=facetPlane(t), sea=t.level<0;
    const base=sea?water:grass, rng=sea?sp:gp;
    const edges=shape[t.sides], R=t.unitCircum, N=t.sides;
    const ox=t.cellCol*TILE_PX, oy=t.cellRow*TILE_PX;

    // corner positions in the same local frame the texel inverse produces
    const A=t.corners.map(c=>[V.dot(c,t.e1)/R, V.dot(c,t.e2)/R]);
    const ang=A.map(q=>Math.atan2(q[1],q[0]));      // already sorted, increasing

    for(let py=0;py<TILE_PX;py++) for(let px=0;px<TILE_PX;px++){
      const o=((oy+py)*cv.width+ox+px)*4;
      const x=px+0.5-TILE_PX/2, y=py+0.5-TILE_PX/2;
      let inset=Infinity;
      for(const e of edges) inset=Math.min(inset,e.d-(e.nx*x+e.ny*y));
      if(inset<-1.0){                       // outside the sampled window
        const q=(!sea&&t.cover==='houses')?mud:base;
        img.data[o]=q[0][0];img.data[o+1]=q[0][1];img.data[o+2]=q[0][2];
        img.data[o+3]=255; continue;        // skip the noise entirely
      }
      const dir=texelDir(t,px,py,pl);
      let pal=base;
      const r=hash3i(Math.floor(dir[0]*K),Math.floor(dir[1]*K),Math.floor(dir[2]*K));
      let d=(fbm3(dir,seed,sea?SEA_OCT:GRASS_OCT,sea?SEA_F0:GRASS_F0)-rng.lo)/rng.span;
      d+=(r-0.5)*(sea?0.03:GRASS_DITHER);

      {
        /* Coast field, interpolated over the fan triangle this texel lies in.
           Along a shared edge the centre weight is zero, so the value depends
           only on the two shared corners and matches from both sides. */
        const lx=((px+0.5)/(TILE_PX/2)-1)/UV_INSET;
        const ly=(1-(py+0.5)/(TILE_PX/2))/UV_INSET;
        const th=Math.atan2(ly,lx);
        let k=N-1;
        for(let i=0;i<N-1;i++) if(th>=ang[i]&&th<ang[i+1]){k=i;break;}
        const P=A[k], Q=A[(k+1)%N];
        const det=P[0]*Q[1]-P[1]*Q[0];
        let wa=Math.max(0,(lx*Q[1]-ly*Q[0])/det),
            wb=Math.max(0,(P[0]*ly-P[1]*lx)/det);
        const wc=Math.max(0,1-wa-wb), s=wa+wb+wc||1;
        const cp=sea?t.cornerShallow:t.cornerProx, cm=sea?t.shallow:t.prox;
        const cb=t.cornerBuilt;
        const prox=(wa*cp[k]+wb*cp[(k+1)%N]+wc*cm)/s;
        if(sea) d+=prox*SEA_SHALLOW;                  // shoal toward the land
        else    d-=Math.pow(prox,COAST_TIGHT)*COAST_DARKEN;

        /* Bare earth wherever the built-up field beats a noisy threshold. Only
           tiles at or beside a village have any, so the extra noise lookup is
           skipped for the whole rest of the planet. */
        const built=(wa*cb[k]+wb*cb[(k+1)%N]+wc*t.built)/s;
        if(!sea && built>0){
          const mn=(fbm3(dir,seed+MUD_SALT,MUD_OCT,MUD_F0)-mp.lo)/mp.span;
          if(built>MUD_EDGE+(mn-0.5)*MUD_SCATTER+(r-0.5)*MUD_DITHER) pal=mud;
        }
      }

      let b=Math.floor(d*pal.length);
      if(!sea && r>1-SPECKLE) b++;          // lone flecks catching the light
      const c=pal[Math.max(0,Math.min(pal.length-1,b))];
      img.data[o]=c[0];img.data[o+1]=c[1];img.data[o+2]=c[2];img.data[o+3]=255;
    }
  }

  tiles.forEach((t,i)=>{t.cellCol=i%cols; t.cellRow=(i/cols)|0; paint(t);});
  ctx.putImageData(img,0,0);
  const tex=pixelTexture(cv);
  return {tex,cols,rows,size:[cv.width,cv.height],
    /* A level change moves the coastline, so the shading of everything within
       the fade radius changes too — not just the tile that was clicked. */
    refresh(t){
      computeProx();
      const seen=new Set([t.id]); let ring=[t.id];
      for(let r=0;r<=SEA_FADE;r++){         // the sea shelf reaches furthest
        const next=[];
        for(const id of ring) for(const j of tiles[id].neighbors)
          if(!seen.has(j)){seen.add(j);next.push(j);}
        ring=next;
      }
      for(const id of seen) paint(tiles[id]);
      ctx.putImageData(img,0,0); tex.needsUpdate=true;
      return seen.size;
    },
    /* A cover change moves no coastline, so this skips the prox rebuild. It
       does have to take in one ring of neighbours, because the bare earth is
       allowed to spill across a hex border. */
    repaint(list){
      computeBuilt();
      const seen=new Set();
      for(const t of list){ seen.add(t.id); for(const j of t.neighbors) seen.add(j); }
      for(const id of seen) paint(tiles[id]);
      ctx.putImageData(img,0,0); tex.needsUpdate=true;
    }};
}

/* ============================================================================
   4. MESH BUILD  —  one non-indexed triangle fan per tile, plus a wall quad
   wherever a tile is higher than the tile across an edge.
   Non-indexed keeps every tile's UVs and colours independent, and makes
   raycast faceIndex -> tileId a flat array lookup.
   ========================================================================== */
/* Per-tile frames: shell radius, facet centroid, facet normal, apothem and the
   world size of one texture pixel. Split out of the mesh builder because the
   ground atlas needs facet normals, and the mesh needs the ground atlas. */
function computeTileFrames(tiles){
  let meanR=0;
  for(const t of tiles){
    let R=0;
    for(const p of t.corners) R=Math.max(R,V.len(V.sub(p,t.center)));
    t.unitCircum=R; meanR+=R;
  }
  meanR/=tiles.length;
  const PX=meanR*RADIUS/(TILE_PX/2*UV_INSET);   // one texture pixel, in world units
  const STEP=LEVEL_PX*PX;                        // one elevation level

  for(const t of tiles){
    const rad=t.radius=RADIUS+t.level*STEP;

    /* The centre vertex sits at the polygon's own centroid, NOT at the sphere
       point above it. Pushing the centre out while the corners are also on the
       shell is what turned every tile into a shallow pyramid. */
    let mid=[0,0,0];
    for(const p of t.corners) mid=V.add(mid,p);
    t.mid=mid=V.mul(mid,rad/t.sides);

    /* One normal for the whole facet (Newell), shared by every vertex, so the
       fan triangles shade as a single flat plane instead of six. */
    let nn=[0,0,0];
    for(let k=0;k<t.sides;k++){
      const p=t.corners[k], q=t.corners[(k+1)%t.sides];
      nn[0]+=(p[1]-q[1])*(p[2]+q[2]);
      nn[1]+=(p[2]-q[2])*(p[0]+q[0]);
      nn[2]+=(p[0]-q[0])*(p[1]+q[1]);
    }
    nn=V.norm(nn);
    if(V.dot(nn,t.center)<0) nn=V.mul(nn,-1);
    t.normal=nn;

    /* Distance from centre to edge midpoint. Insetting the polygon by w is a
       uniform scale of (apothem-w)/apothem, which mitres the corners for free. */
    let ap=0;
    for(let k=0;k<t.sides;k++){
      const m=V.mul(V.add(t.corners[k],t.corners[(k+1)%t.sides]),rad*0.5);
      ap+=V.len(V.sub(m,mid));
    }
    t.apothem=ap/t.sides;
    t.texel=t.unitCircum*rad/(TILE_PX/2*UV_INSET);   // one texture pixel on THIS tile
  }
  return {px:PX,step:STEP};
}

function buildMesh(tiles,ground,cliffTex,foamTex,PX){
  const pos=[],uv=[],col=[],nrm=[],faceTile=[];
  const wPos=[],wUv=[],wCol=[],wNrm=[],wallTile=[];
  const fPos=[],fUv=[],fNrm=[];
  const edgePos=[];
  let vcount=0;

  for(const t of tiles){
    const rad=t.radius, mid=t.mid, nn=t.normal, R=t.unitCircum;

    /* No per-tile tint any more. A uniform shift per hex would show up as a
       brightness step at every border and undo the seamless ground. The colour
       attribute is kept solely for the territory highlight. */
    const tint=t.tint=[1,1,1];
    t.vertexStart=vcount; t.vertexCount=t.sides*3; vcount+=t.vertexCount;

    const uvOf=p=>{
      const d=V.sub(p,t.center);
      const x=V.dot(d,t.e1)/R, y=V.dot(d,t.e2)/R;
      return [ (t.cellCol+0.5+x*0.5*UV_INSET)/ground.cols,
               (ground.rows-1-t.cellRow+0.5+y*0.5*UV_INSET)/ground.rows ];
    };
    const uvC=[ (t.cellCol+0.5)/ground.cols,
                (ground.rows-1-t.cellRow+0.5)/ground.rows ];

    for(let k=0;k<t.sides;k++){
      const a=V.mul(t.corners[k],rad);
      const b=V.mul(t.corners[(k+1)%t.sides],rad);
      const ua=uvOf(t.corners[k]), ub=uvOf(t.corners[(k+1)%t.sides]);
      pos.push(mid[0],mid[1],mid[2], a[0],a[1],a[2], b[0],b[1],b[2]);
      uv.push(uvC[0],uvC[1], ua[0],ua[1], ub[0],ub[1]);
      for(let q=0;q<3;q++){
        col.push(tint[0],tint[1],tint[2]);
        nrm.push(nn[0],nn[1],nn[2]);
      }
      faceTile.push(t.id);
    }

    /* Tile border for the Edges toggle. A GL line is one DEVICE pixel and so
       changes apparent width with zoom; this is a ribbon inset by half a
       texture pixel, and since both tiles draw their half the seam is exactly
       one world pixel at every zoom and every world size. */
    /* Half a GLOBAL world pixel, not half of this tile's own texel. A tile's
       texel varies about +-19% with its circumradius near the pentagons, which
       would make the grid visibly thicker in some places than others. */
    const gw=0.5*PX;
    const goff=V.mul(nn,0.0010*RADIUS);
    for(let k=0;k<t.sides;k++){
      const A=V.add(V.mul(t.corners[k],rad),goff);
      const B=V.add(V.mul(t.corners[(k+1)%t.sides],rad),goff);
      /* Scale about the centroid using THIS edge's own apothem. One scale for
         the whole tile is only exact for a regular polygon, and tiles near the
         pentagons are not regular — that drifted the width by up to 30%. */
      const gd=V.norm(V.sub(B,A)), gv=V.sub(mid,A);
      const gap=V.len(V.sub(gv,V.mul(gd,V.dot(gv,gd))));   // perpendicular, not to the midpoint
      const gs=(gap-gw)/gap;
      const Ai=V.add(mid,V.add(V.mul(V.sub(A,mid),gs),V.mul(goff,1-gs)));
      const Bi=V.add(mid,V.add(V.mul(V.sub(B,mid),gs),V.mul(goff,1-gs)));
      edgePos.push(A[0],A[1],A[2], B[0],B[1],B[2], Bi[0],Bi[1],Bi[2]);
      edgePos.push(A[0],A[1],A[2], Bi[0],Bi[1],Bi[2], Ai[0],Ai[1],Ai[2]);
    }
  }

  /* --------------------------------------------------------------------------
     COAST. Instead of a square cliff, the drop is a wedge: the top edge stays
     on the land tile's edge and the bottom edge runs BEACH_PX out over the
     water, giving a triangular cross-section. The surf band continues from
     there into open water.

     The corner displacement is a property of the CORNER, not of the tile
     asking for it — derived from the three tiles meeting there — so every tile
     touching that corner pushes it to the identical point and the coastline
     cannot crack. The two land tiles either side of a coastal corner both
     build a ramp reaching it, so the wedges join without needing end caps.
     -------------------------------------------------------------------------- */
  const beach=BEACH_PX*PX, surf=(BEACH_PX+FOAM_PX)*PX;

  function cornerPush(t,k){
    const trio=t.cornerTiles[k];
    let lo=[0,0,0], hi=[0,0,0], nl=0, nh=0, min=Infinity;
    for(const id of trio) min=Math.min(min,tiles[id].level);
    for(const id of trio){
      const c=tiles[id].center;
      if(tiles[id].level===min){lo=V.add(lo,c);nl++;} else {hi=V.add(hi,c);nh++;}
    }
    if(!nh) return null;                       // corner is not on a level change
    const c=t.corners[k];
    const dir=V.sub(V.mul(lo,1/nl),V.mul(hi,1/nh));
    const tang=V.sub(dir,V.mul(c,V.dot(dir,c)));
    const l=V.len(tang);
    return l<1e-9 ? null : V.mul(tang,1/l);
  }
  const shift=(c,d,amt)=>d?V.norm(V.add(c,V.mul(d,amt))):c;

  for(const t of tiles){
    const rad=t.radius, mid=t.mid, tint=t.tint;
    for(let k=0;k<t.sides;k++){
      const o=tiles[t.edgeNeighbors[k]];
      if(o.level>=t.level) continue;
      const k2=(k+1)%t.sides;
      const A=t.corners[k], B=t.corners[k2], rB=o.radius;
      const dA=cornerPush(t,k), dB=cornerPush(t,k2);

      const At=V.mul(A,rad),               Bt=V.mul(B,rad);
      const Ab=V.mul(shift(A,dA,beach),rB), Bb=V.mul(shift(B,dB,beach),rB);

      // Newell over the four corners: the wedge face is no longer planar
      let wn=[0,0,0];
      const ring=[At,Ab,Bb,Bt];
      for(let q=0;q<4;q++){
        const p=ring[q], r=ring[(q+1)%4];
        wn[0]+=(p[1]-r[1])*(p[2]+r[2]);
        wn[1]+=(p[2]-r[2])*(p[0]+r[0]);
        wn[2]+=(p[0]-r[0])*(p[1]+r[1]);
      }
      wn=V.norm(wn);
      if(V.dot(wn,V.sub(V.mul(V.add(At,Bt),0.5),mid))<0) wn=V.mul(wn,-1);

      const u0=hash2(t.id*0.53+k*2.1,k*1.7);   // phase so segments do not align
      const u1=u0+V.len(V.sub(Bt,At))/(PX*CLIFF_W);
      const vTop=V.len(V.sub(Ab,At))/(PX*CLIFF_H);   // slant length keeps texels square

      wPos.push(At[0],At[1],At[2], Ab[0],Ab[1],Ab[2], Bb[0],Bb[1],Bb[2]);
      wPos.push(At[0],At[1],At[2], Bb[0],Bb[1],Bb[2], Bt[0],Bt[1],Bt[2]);
      wUv.push(u0,vTop, u0,0, u1,0);
      wUv.push(u0,vTop, u1,0, u1,vTop);
      for(let q=0;q<6;q++){
        wCol.push(tint[0],tint[1],tint[2]);
        wNrm.push(wn[0],wn[1],wn[2]);
      }
      wallTile.push(t.id,t.id);

      // surf, laid flat on the water just beyond the wedge
      const rF=rB*1.0015;                        // clear of the water facet plane
      const Ai=V.mul(shift(A,dA,beach),rF), Bi=V.mul(shift(B,dB,beach),rF);
      const Ao=V.mul(shift(A,dA,surf),rF),  Bo=V.mul(shift(B,dB,surf),rF);
      const fu1=u0+V.len(V.sub(Bi,Ai))/(PX*FOAM_W);
      fPos.push(Ai[0],Ai[1],Ai[2], Ao[0],Ao[1],Ao[2], Bo[0],Bo[1],Bo[2]);
      fPos.push(Ai[0],Ai[1],Ai[2], Bo[0],Bo[1],Bo[2], Bi[0],Bi[1],Bi[2]);
      fUv.push(u0,0.98, u0,0.02, fu1,0.02);
      fUv.push(u0,0.98, fu1,0.02, fu1,0.98);
      for(let q=0;q<6;q++) fNrm.push(o.normal[0],o.normal[1],o.normal[2]);
    }
  }

  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  g.setAttribute('normal',new THREE.Float32BufferAttribute(nrm,3));

  const mat=new THREE.MeshLambertMaterial({map:ground.tex,vertexColors:true});
  const mesh=new THREE.Mesh(g,mat);

  const wg=new THREE.BufferGeometry();
  wg.setAttribute('position',new THREE.Float32BufferAttribute(wPos,3));
  wg.setAttribute('uv',new THREE.Float32BufferAttribute(wUv,2));
  wg.setAttribute('color',new THREE.Float32BufferAttribute(wCol,3));
  wg.setAttribute('normal',new THREE.Float32BufferAttribute(wNrm,3));
  const walls=new THREE.Mesh(wg,new THREE.MeshLambertMaterial({map:cliffTex,vertexColors:true}));

  const fg=new THREE.BufferGeometry();
  fg.setAttribute('position',new THREE.Float32BufferAttribute(fPos,3));
  fg.setAttribute('uv',new THREE.Float32BufferAttribute(fUv,2));
  fg.setAttribute('normal',new THREE.Float32BufferAttribute(fNrm,3));
  const foam=new THREE.Mesh(fg,new THREE.MeshLambertMaterial({
    map:foamTex, alphaTest:0.5, transparent:false, side:THREE.DoubleSide
  }));
  foam.renderOrder=1;

  const eg=new THREE.BufferGeometry();
  eg.setAttribute('position',new THREE.Float32BufferAttribute(edgePos,3));
  const edges=new THREE.Mesh(eg,new THREE.MeshBasicMaterial({
    color:0x1b2c22, side:THREE.DoubleSide
  }));
  edges.visible=false;

  return {mesh,walls,foam,edges,faceTile,wallTile};
}

/* ============================================================================
   4b. FIELDS  —  farmland is drawn per ZONE, not per tile. Every connected run
   of field tiles is projected onto one tangent plane, cut into parcels by a
   randomised binary split, each parcel is shaved back to leave a strip of grass
   around it, and only THEN is it clipped against the individual hexes.

   Parcelling before the hex clip is the whole trick: a field that straddles a
   tile border is cut from a single polygon, so both halves inherit the same
   crop, the same furrow direction and the same texture phase, and the border
   between the two tiles is invisible.
   ========================================================================== */
/* Straight from the reference art: a field is one flat colour with a thin
   darker line every few pixels. `edge` is the colour of the sloped side.
   `h` is the height of the top surface in world pixels; the side runs out the
   same distance, so the profile is a 45-degree wedge, not a wall. */
const FIELD_CROPS = [
  {key:'dirt',   base:'#a57b4b', furrow:'#84623f', edge:'#8f6a40', h:1.0, w:0.26},
  {key:'green',  base:'#51982e', furrow:'#427d24', edge:'#468228', h:1.5, w:0.22},
  {key:'olive',  base:'#c0c729', furrow:'#a5c035', edge:'#a9af24', h:1.5, w:0.22},
  {key:'yellow', base:'#f1d534', furrow:'#dcbe20', edge:'#d7bd2c', h:1.5, w:0.30}
];
const FURROW_PX   = 5;     // world pixels per furrow cycle: 1 dark line, 4 plain
/* The top face is the parcel minus this margin, and the sloped side then grows
   back OUTWARD into it, so the grass left showing between two fields is
   2*FIELD_TRIM minus their two slopes — roughly 2 to 3 world px. */
const FIELD_TRIM  = 2.5;
/* Sized off the reference art, where a field runs roughly 27x15 world pixels.
   Going smaller is a trap: the sloped sides are a fixed 1 to 1.5px, so a 12px
   parcel ends up more edge than field. */
const PARCEL_MAX  = 34;    // keep splitting a parcel while it is wider than this
const PARCEL_MIN  = 18;    // ...but never leave a strip thinner than this
const SLIVER_PX2  = 2;     // drop a piece smaller than this, in square world px
const THIN_PX     = 0.35;  // ...or thinner than this, i.e. a sub-pixel scratch
const FIELD_MIN_PX2 = 26;  // and drop a whole field smaller than ~5x5 world px
const FARM_SPAN   = 0.40;  // radians: one zone never spans more sky than this
const POST_CHANCE = 0.15;  // share of fields that get a fence
const POST_STEP   = 6;     // world px between posts, measured along the border
const POST_W = 1, POST_TALL = 3;                       // the post itself, in world px
const POST_TONES = {top:'#b0803f', side:'#8a5c2a'};
const FARM_SHARE  = 0.16;  // share of land that starts out as fields

/* One column per furrow cycle, two rows per crop: the flat top, then the side.
   5 texels wide with nearest sampling means one texel is exactly one world
   pixel, so the lines stay on the same art grid as the rest of the planet. */
const FIELD_ROWS = FIELD_CROPS.length*2;
const fieldRowV = r => (FIELD_ROWS-0.5-r)/FIELD_ROWS;   // canvas row -> v, flipY aware

function makeFieldTexture(){
  const cv=document.createElement('canvas');
  cv.width=FURROW_PX; cv.height=FIELD_ROWS;
  const ctx=cv.getContext('2d');
  const img=ctx.createImageData(FURROW_PX,FIELD_ROWS);
  const put=(x,y,c)=>{const o=(y*FURROW_PX+x)*4;
    img.data[o]=c[0];img.data[o+1]=c[1];img.data[o+2]=c[2];img.data[o+3]=255;};
  FIELD_CROPS.forEach((crop,i)=>{
    const base=rgb(crop.base), furrow=rgb(crop.furrow), edge=rgb(crop.edge);
    const edgeLine=edge.map(v=>Math.round(v*0.84));
    for(let x=0;x<FURROW_PX;x++){
      put(x,2*i,   x===0?furrow:base);       // flat top
      put(x,2*i+1, x===0?edgeLine:edge);     // the wedge side, furrows carrying over
    }
  });
  ctx.putImageData(img,0,0);
  const tex=pixelTexture(cv,THREE.RepeatWrapping);
  tex.wrapT=THREE.ClampToEdgeWrapping;       // v picks a row and must never wrap
  return tex;
}

/* ---------------------------------------------------------------------------
   2D convex polygon kit. Every edge carries a TAG: 1 means "this is the outside
   of a field and needs a sloped side", 0 means "this is only where one hex hands
   over to the next, keep it flush". Tags are what let the same routine handle
   both the parcel outline and the hex cut without a second pass.
   ------------------------------------------------------------------------ */
function polyArea(p){
  let a=0;
  for(let i=0;i<p.length;i++){const q=p[(i+1)%p.length];a+=p[i][0]*q[1]-q[0]*p[i][1];}
  return a/2;
}

/* Sutherland-Hodgman against one half-plane, keeping nx*x+ny*y <= d. An edge
   that survives keeps its own tag; the edge created along the cut takes `tag`. */
function clipHalf(poly,tags,nx,ny,d,tag){
  const out=[],ot=[],n=poly.length;
  for(let i=0;i<n;i++){
    const A=poly[i],B=poly[(i+1)%n],t=tags[i];
    const da=nx*A[0]+ny*A[1]-d, db=nx*B[0]+ny*B[1]-d;
    const ain=da<=0, bin=db<=0;
    if(ain){
      out.push(A); ot.push(t);
      if(!bin){
        const s=da/(da-db);
        out.push([A[0]+(B[0]-A[0])*s,A[1]+(B[1]-A[1])*s]); ot.push(tag);
      }
    }else if(bin){
      const s=da/(da-db);
      out.push([A[0]+(B[0]-A[0])*s,A[1]+(B[1]-A[1])*s]); ot.push(t);
    }
  }
  return [out,ot];
}

function clipToHull(poly,tags,hull,hullTags){
  let p=poly,t=tags;
  for(let i=0;i<hull.length && p.length;i++){
    const A=hull[i],B=hull[(i+1)%hull.length];
    const dx=B[0]-A[0],dy=B[1]-A[1],L=Math.hypot(dx,dy);
    if(L<1e-12) continue;
    const nx=dy/L, ny=-dx/L;                 // outward normal of a CCW hull
    [p,t]=clipHalf(p,t,nx,ny,nx*A[0]+ny*A[1],hullTags[i]);
  }
  return [p,t];
}

/* Pull every edge in by w. For a convex polygon, clipping by its own edges
   moved inward IS the offset, and it collapses to nothing rather than
   self-intersecting when w gets too big for the shape. */
function trimConvex(poly,w){
  let p=poly,t=poly.map(()=>1);
  for(let i=0;i<poly.length && p.length;i++){
    const A=poly[i],B=poly[(i+1)%poly.length];
    const dx=B[0]-A[0],dy=B[1]-A[1],L=Math.hypot(dx,dy);
    if(L<1e-12) continue;
    const nx=dy/L,ny=-dx/L;
    [p,t]=clipHalf(p,t,nx,ny,nx*A[0]+ny*A[1]-w,1);
  }
  return p;
}

/* Drop zero-length edges, keeping tags in step with the vertices. */
function dedupe(p,t,eps){
  const P=[],T=[];
  for(let i=0;i<p.length;i++){
    const q=p[i], r=p[(i+1)%p.length];
    if(Math.hypot(r[0]-q[0],r[1]-q[1])<eps) continue;
    P.push(q); T.push(t[i]);
  }
  return [P,T];
}

/* Push every WALL edge OUTWARD by w, leave the hex seams exactly where they are,
   and take the corners where the moved lines cross. Outward is the safe
   direction: an inset can fold a thin shape inside out and has to be thrown
   away, an offset never can, so no fragment of a field is ever lost.

   Because every wall line comes from the parcel polygon — which both sides of a
   hex seam were cut from — two neighbouring pieces compute the identical corner
   and their sides line up across the seam. A very sharp corner would throw the
   mitre a long way out, so the move is capped. */
function mitreOffset(poly,tags,w,cap){
  const n=poly.length, L=[];
  for(let i=0;i<n;i++){
    const A=poly[i],B=poly[(i+1)%n];
    const dx=B[0]-A[0],dy=B[1]-A[1],len=Math.hypot(dx,dy);
    if(len<1e-12){L.push(null);continue;}
    const nx=dy/len, ny=-dx/len;              // outward normal of a CCW polygon
    L.push({nx,ny,d:nx*A[0]+ny*A[1]+(tags[i]?w:0)});
  }
  const out=[];
  for(let i=0;i<n;i++){
    const a=L[(i-1+n)%n], b=L[i], v=poly[i];
    let q=null;
    if(a&&b){
      const det=a.nx*b.ny-a.ny*b.nx;
      if(Math.abs(det)>1e-9) q=[(a.d*b.ny-b.d*a.ny)/det,(a.nx*b.d-b.nx*a.d)/det];
    }
    if(!q){out.push([v[0],v[1]]);continue;}
    const ex=q[0]-v[0], ey=q[1]-v[1], d=Math.hypot(ex,ey);
    out.push(d>cap ? [v[0]+ex*cap/d, v[1]+ey*cap/d] : q);
  }
  return out;
}

/* Inradius of a convex polygon, near enough: area over half-perimeter. Used to
   spot pieces that are scratches rather than fields. */
function polyThickness(p){
  let per=0;
  for(let i=0;i<p.length;i++){
    const q=p[i],r=p[(i+1)%p.length];
    per+=Math.hypot(r[0]-q[0],r[1]-q[1]);
  }
  return per<1e-12 ? 0 : 2*polyArea(p)/per;
}

/* Parcels. Halve the zone's bounding box again and again with straight cuts,
   always across whatever axis is currently widest, at a wobbly middle and with
   the cut angle nudged a few degrees so nothing lines up into a grid.
   A Voronoi split would tile the plane with no room left over; this leaves the
   margin that the grass strips between fields are shaved out of. */
function parcelSplit(poly,rnd,maxW,minW,out,depth){
  if(depth>13||poly.length<3){out.push(poly);return;}
  let best=null;
  for(let i=0;i<poly.length;i++){
    const A=poly[i],B=poly[(i+1)%poly.length];
    const dx=B[0]-A[0],dy=B[1]-A[1],L=Math.hypot(dx,dy);
    if(L<1e-12) continue;
    for(const d of [[dx/L,dy/L],[-dy/L,dx/L]]){
      let lo=Infinity,hi=-Infinity;
      for(const q of poly){const s=q[0]*d[0]+q[1]*d[1];if(s<lo)lo=s;if(s>hi)hi=s;}
      if(!best||hi-lo>best.span) best={d,span:hi-lo};
    }
  }
  if(!best||best.span<=maxW||best.span<minW*2){out.push(poly);return;}

  const a=Math.atan2(best.d[1],best.d[0])+(rnd()-0.5)*0.34;
  const nx=Math.cos(a), ny=Math.sin(a);
  let lo=Infinity,hi=-Infinity;
  for(const q of poly){const s=q[0]*nx+q[1]*ny;if(s<lo)lo=s;if(s>hi)hi=s;}
  const span=hi-lo;
  const room=minW/span;
  const f=Math.min(1-room,Math.max(room,0.34+rnd()*0.32));
  const d=lo+span*f, tags=poly.map(()=>1);
  const [pa]=clipHalf(poly,tags,nx,ny,d,1);
  const [pb]=clipHalf(poly,tags,-nx,-ny,-d,1);
  if(pa.length<3||pb.length<3){out.push(poly);return;}
  parcelSplit(pa,rnd,maxW,minW,out,depth+1);
  parcelSplit(pb,rnd,maxW,minW,out,depth+1);
}

/* Farmland arrives in clumps, because one lone hex of wheat is not a farm: the
   whole point of the renderer is that neighbours merge into a single parcelled
   zone, and that only shows when tiles come in groups. */
function seedCover(tiles,seed){
  const rnd=mulberry32((seed^0x5bf03635)|0);
  for(const t of tiles) t.cover=null;
  const land=tiles.filter(t=>t.level>=0);
  if(!land.length) return;
  /* Woods first, then farmland in what is left: clearings cut out of forest
     read as settled land, whereas forest dropped into gaps between fields reads
     as leftovers. */
  for(const [kind,share,cling] of [['houses',TOWN_SHARE,0.92],
                                   ['forest',WOOD_SHARE,0.90],
                                   ['fields',FARM_SHARE,0.85]]){
    let budget=Math.round(land.length*share), guard=0;
    while(budget>0 && guard++<900){
      const s=land[(rnd()*land.length)|0];
      if(s.cover) continue;
      s.cover=kind; budget--;
      let ring=[s], p=cling;
      while(budget>0 && ring.length && p>0.2){
        const next=[];
        for(const t of ring) for(const j of t.neighbors){
          if(budget<=0) break;
          const n=tiles[j];
          if(n.cover||n.level<0||rnd()>p) continue;
          n.cover=kind; budget--; next.push(n);
        }
        ring=next; p*=0.62;
      }
    }
  }
}

/* ---------------------------------------------------------------------------
   Shared by both cover renderers. A ZONE is a connected run of tiles carrying
   the same cover, small enough that one tangent plane describes it without
   stretching. A zone is exactly the thing that visually merges: everything
   inside one is laid out as a single piece of scenery and only afterwards cut
   up along the hex borders.
   ------------------------------------------------------------------------ */
function coverZones(tiles,kind,span){
  const list=[], mark=new Uint8Array(tiles.length);
  for(const t of tiles) if(t.cover===kind&&t.level>=0){list.push(t);mark[t.id]=1;}
  const zoneOf=new Int32Array(tiles.length).fill(-1), zones=[];
  const cap=Math.cos(span);
  for(const s of list){
    if(zoneOf[s.id]>=0) continue;
    const z=zones.length, group=[], q=[s.id];
    zoneOf[s.id]=z;
    for(let hd=0;hd<q.length;hd++){
      const t=tiles[q[hd]]; group.push(t);
      for(const j of t.neighbors){
        if(!mark[j]||zoneOf[j]>=0) continue;
        if(V.dot(tiles[j].center,s.center)<cap) continue;
        zoneOf[j]=z; q.push(j);
      }
    }
    zones.push(group);
  }
  return {zones,zoneOf,mark,total:list.length};
}

/* Tangent frame for one zone, spun by an integer hash so no two zones on the
   planet share a layout grid. Gnomonic projection: rays from the planet's
   centre out to the tangent plane, under which a straight edge in 3D stays a
   straight edge here — so working in the plane and lifting the answer back is
   exact, not an approximation. */
function zoneFrame(zone,salt){
  let c=[0,0,0];
  for(const t of zone) c=V.add(c,t.center);
  c=V.norm(c);
  const ref=Math.abs(c[2])<0.9?[0,0,1]:[1,0,0];
  const a1=V.norm(V.sub(ref,V.mul(c,V.dot(ref,c)))), a2=V.cross(c,a1);
  const spin=hash3i(zone[0].id,zone.length,salt)*Math.PI*2;
  const e1=V.add(V.mul(a1,Math.cos(spin)),V.mul(a2,Math.sin(spin)));
  const e2=V.cross(c,e1);
  return {c,e1,e2,
    to2:p=>{const w=V.dot(p,c);return [V.dot(p,e1)/w,V.dot(p,e2)/w];},
    to3:q=>V.norm(V.add(c,V.add(V.mul(e1,q[0]),V.mul(e2,q[1])))),

    /* Equal-distance variant, for anything laid out on a regular grid. Under
       gnomonic projection a cell a third of a radian off centre comes back up
       to 22% smaller than it went in, which would leave a border asked to be
       one world pixel measuring 0.8 — and at roughly one world pixel per screen
       pixel that shows up as an outline with holes in it. Here the distance
       from the zone centre is carried through unchanged, so a cell keeps its
       size radially and loses only sin(p)/p across, about 3% at the far edge.
       Hex corners still project to points and the chord between two of them is
       still shared by both tiles, so the hulls stay watertight either way. */
    to2e:p=>{
      const d=Math.max(-1,Math.min(1,V.dot(p,c))), rho=Math.acos(d);
      const t=V.sub(p,V.mul(c,d)), l=V.len(t);
      if(l<1e-12) return [0,0];
      return [V.dot(t,e1)/l*rho, V.dot(t,e2)/l*rho];
    },
    to3e:q=>{
      const rho=Math.hypot(q[0],q[1]);
      if(rho<1e-12) return c.slice();
      const u=V.mul(V.add(V.mul(e1,q[0]),V.mul(e2,q[1])),1/rho);
      return V.add(V.mul(c,Math.cos(rho)),V.mul(u,Math.sin(rho)));
    }};
}

/* Newell normal of a ring of 3D points. */
function ringNormal(r){
  let n=[0,0,0];
  for(let i=0;i<r.length;i++){
    const p=r[i],q=r[(i+1)%r.length];
    n[0]+=(p[1]-q[1])*(p[2]+q[2]);
    n[1]+=(p[2]-q[2])*(p[0]+q[0]);
    n[2]+=(p[0]-q[0])*(p[1]+q[1]);
  }
  return V.norm(n);
}

/* Which of `polys` contains q? Convex, CCW, so inside means left of every edge. */
function hullAt(polys,q){
  for(let i=0;i<polys.length;i++){
    const h=polys[i]; let hit=true;
    for(let k=0;k<h.length;k++){
      const A=h[k],B=h[(k+1)%h.length];
      if((B[0]-A[0])*(q[1]-A[1])-(B[1]-A[1])*(q[0]-A[0])<-1e-12){hit=false;break;}
    }
    if(hit) return i;
  }
  return -1;
}

function buildFields(tiles,PX){
  const Z=coverZones(tiles,'fields',FARM_SPAN);
  if(!Z.total) return null;
  const {zones,zoneOf}=Z, farm={length:Z.total};

  const pos=[],uv=[],col=[],nrm=[];
  const qPos=[],qCol=[],qNrm=[];
  const trim=FIELD_TRIM*PX, furrowLen=FURROW_PX*PX, hair=0.06*PX;
  const postTop=rgb(POST_TONES.top).map(v=>v/255);
  const postSide=rgb(POST_TONES.side).map(v=>v/255);
  let parcelCount=0, fenceCount=0;

  for(const zone of zones){
    const F=zoneFrame(zone,17), e1=F.e1, e2=F.e2, to2=F.to2, to3=F.to3;

    const hulls=[], hullTags=[];
    for(const t of zone){
      let h=t.corners.map(to2), g=[];
      for(let k=0;k<t.sides;k++){
        const j=t.edgeNeighbors[k];
        // 0 = the field carries on into the next hex, so no side is built here
        g.push(j>=0 && zoneOf[j]===zoneOf[t.id] ? 0 : 1);
      }
      if(polyArea(h)<0){                     // paranoia: keep the clipper's CCW
        const n=h.length, g2=new Array(n);
        for(let k=0;k<n;k++) g2[k]=g[(n-2-k+n)%n];
        h=h.slice().reverse(); g=g2;
      }
      hulls.push(h); hullTags.push(g);
    }

    let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
    for(const h of hulls) for(const q of h){
      if(q[0]<x0)x0=q[0]; if(q[0]>x1)x1=q[0];
      if(q[1]<y0)y0=q[1]; if(q[1]>y1)y1=q[1];
    }
    /* Overshoot the zone, so the cut lines are not pinned to its own outline
       and parcels run off the edge the way real farmland does. */
    const pad=PARCEL_MAX*PX*0.6;
    const box=[[x0-pad,y0-pad],[x1+pad,y0-pad],[x1+pad,y1+pad],[x0-pad,y1+pad]];
    const rnd=mulberry32(((zone[0].id*2654435761)^(zone.length*40503))|0);
    const parcels=[];
    parcelSplit(box,rnd,PARCEL_MAX*PX,PARCEL_MIN*PX,parcels,0);


    for(const parcel of parcels){
      const foot=trimConvex(parcel,trim);
      if(foot.length<3) continue;

      /* Crop, tone, furrow direction and fence belong to the PARCEL, so every
         hex it touches renders the same field rather than a patchwork per tile.
         Keyed on the centroid quantised to an eighth of a world pixel, through
         the integer hash: the sin-based hash2 clusters badly on inputs this
         correlated and skewed the crop mix by a third. */
      let cx=0,cy=0;
      for(const q of foot){cx+=q[0];cy+=q[1];}
      cx/=foot.length; cy/=foot.length;
      const qx=Math.round(cx/PX*8), qy=Math.round(cy/PX*8);
      const rh=s=>hash3i(qx,qy,s);
      let ci=FIELD_CROPS.length-1,acc=0;
      const h0=rh(1);
      for(let i=0;i<FIELD_CROPS.length;i++){acc+=FIELD_CROPS[i].w;if(h0<acc){ci=i;break;}}
      const crop=FIELD_CROPS[ci];
      const lift=crop.h*PX, slope=crop.h*PX;      // 45-degree wedge, not a wall
      const shade=0.94+rh(2)*0.12;                // barely-there variation per field
      const topRow=fieldRowV(2*ci), sideRow=fieldRowV(2*ci+1);

      // furrows run along the longest side, or across it on a coin flip
      let fd=[1,0], bestL=-1;
      for(let i=0;i<foot.length;i++){
        const A=foot[i],B=foot[(i+1)%foot.length];
        const dx=B[0]-A[0],dy=B[1]-A[1],L=Math.hypot(dx,dy);
        if(L>bestL){bestL=L;fd=[dx/L,dy/L];}
      }
      if(rh(3)<0.45) fd=[-fd[1],fd[0]];
      // u must climb ACROSS the lines for them to run along fd
      const fn=V.norm(V.add(V.mul(e1,-fd[1]),V.mul(e2,fd[0])));
      const phase=rh(4);
      const uOf=p=>V.dot(p,fn)/furrowLen+phase;

      /* Pass one: cut the footprint against every hex it touches. */
      const bits=[];
      for(let zi=0;zi<zone.length;zi++){
        const t=zone[zi];
        let [piece,tags]=clipToHull(foot,foot.map(()=>1),hulls[zi],hullTags[zi]);
        [piece,tags]=dedupe(piece,tags,1e-7*PX+1e-12);
        if(piece.length<3) continue;
        /* Only genuine scratches are dropped, and only on the two tests that a
           sub-pixel shard fails. Anything larger is kept whatever its shape,
           because a piece is a FRAGMENT of a field: dropping one leaves a hole
           in the middle of the field rather than trimming its edge. */
        const ar=polyArea(piece);
        if(ar<SLIVER_PX2*PX*PX||polyThickness(piece)<THIN_PX*PX) continue;
        bits.push({t,piece,tags,pl:facetPlane(t),area:ar});
      }
      if(!bits.length) continue;
      /* A parcel that only grazes the zone survives its per-piece tests but
         renders as a pointy shard. Judge it once, on the whole parcel, so a
         field is either drawn or not — never holed in the middle. */
      let kept=0;
      for(const b of bits) kept+=b.area;
      if(kept<FIELD_MIN_PX2*PX*PX) continue;
      parcelCount++;

      /* ONE normal for the whole parcel, area-weighted across the hexes it
         covers. The hexes are separate flat facets with normals a few degrees
         apart, so shading each fragment by its own facet would draw a crease
         along the tile seam — exactly the join the merge is supposed to hide.
         The sloped sides keep their own normals; they really are slanted. */
      let pn=[0,0,0];
      for(const b of bits) pn=V.add(pn,V.mul(b.pl.n,b.area));
      pn=V.norm(pn);

      /* Pass two: geometry. */
      for(const b of bits){
        const {piece,tags,pl}=b, rad=b.t.radius;
        /* Find the tile's FACET plane along this ray, then raise the vertex
           along the RAY, not along the facet normal. Two neighbouring facets
           both contain their shared edge, so on that edge they agree on the
           distance — and because the lift direction is the ray, which is a
           property of the point rather than of the tile asking, both tiles
           land on the identical vertex. Lifting along each tile's own normal
           instead left a step of ~0.22px at every seam, the normals being some
           5 degrees apart. */
        const at=(q,hh)=>{
          const dir=to3(q);
          return V.mul(dir,pl.d*rad/V.dot(dir,pl.n)+hh);
        };
        /* The top IS the piece. Two neighbouring pieces were cut from the same
           footprint by the same hex-edge line, so their tops meet along that
           line exactly and the field reads as one surface. */
        const T3=piece.map(q=>at(q,lift));
        const G3=mitreOffset(piece,tags,slope,slope*2.2).map(q=>at(q,hair));
        const push=(p,n,uu)=>{
          pos.push(p[0],p[1],p[2]);
          nrm.push(n[0],n[1],n[2]);
          col.push(shade,shade,shade);
          uv.push(uu[0],uu[1]);
        };

        let mid=[0,0,0];
        for(const p of T3) mid=V.add(mid,p);
        mid=V.mul(mid,1/T3.length);
        const uMid=[uOf(mid),topRow];
        for(let k=0;k<T3.length;k++){
          const A=T3[k],B=T3[(k+1)%T3.length];
          push(mid,pn,uMid);
          push(A,pn,[uOf(A),topRow]);
          push(B,pn,[uOf(B),topRow]);
        }

        let ctr=[0,0,0];
        for(const p of G3) ctr=V.add(ctr,p);
        ctr=V.mul(ctr,1/G3.length);
        for(let k=0;k<piece.length;k++){
          if(!tags[k]) continue;                   // hex seam: stays flush
          const kn=(k+1)%piece.length;
          let ring=[G3[k],G3[kn],T3[kn],T3[k]];
          let wn=ringNormal(ring);
          if(V.dot(wn,V.sub(V.mul(V.add(G3[k],G3[kn]),0.5),ctr))<0){
            ring=[G3[k],T3[k],T3[kn],G3[kn]]; wn=V.mul(wn,-1);
          }
          const uu=ring.map(p=>[uOf(p),sideRow]);
          push(ring[0],wn,uu[0]); push(ring[1],wn,uu[1]); push(ring[2],wn,uu[2]);
          push(ring[0],wn,uu[0]); push(ring[2],wn,uu[2]); push(ring[3],wn,uu[3]);
        }
      }
      /* Fences: a minority of fields get posts, evenly spaced right around the
         parcel's own border — the field's outline, not the hex grid's. */
      if(rh(5)>=POST_CHANCE) continue;
      fenceCount++;
      const step=POST_STEP*PX, hw=POST_W*PX*0.5, hh=POST_TALL*PX;
      let acc2=step*0.5;
      for(let i=0;i<foot.length;i++){
        const A=foot[i],B=foot[(i+1)%foot.length];
        const dx=B[0]-A[0],dy=B[1]-A[1],L=Math.hypot(dx,dy);
        if(L<1e-12) continue;
        const ux=dx/L,uy=dy/L;
        let s=acc2;
        for(;s<L;s+=step){
          const q=[A[0]+ux*s,A[1]+uy*s];
          const zi=hullAt(hulls,q);
          if(zi<0) continue;
          const t=zone[zi], pl=facetPlane(t), dir=to3(q);
          const base=V.mul(dir,pl.d*t.radius/V.dot(dir,pl.n));
          const up=dir;                          // same ray-based up as the fields
          let al=V.add(V.mul(e1,ux),V.mul(e2,uy));
          al=V.norm(V.sub(al,V.mul(up,V.dot(al,up))));
          const cr=V.cross(up,al);
          const P=(sx,sy,sz)=>V.add(base,V.add(V.add(V.mul(al,hw*sx),V.mul(cr,hw*sy)),
                                               V.mul(up,sz*hh)));
          const b=[P(-1,-1,0),P(1,-1,0),P(1,1,0),P(-1,1,0)];
          const u=[P(-1,-1,1),P(1,-1,1),P(1,1,1),P(-1,1,1)];
          const quad=(r,n,tone)=>{
            for(const k of [0,1,2,0,2,3]){
              qPos.push(r[k][0],r[k][1],r[k][2]);
              qNrm.push(n[0],n[1],n[2]);
              qCol.push(tone[0],tone[1],tone[2]);
            }
          };
          quad(u,up,postTop);
          quad([b[0],b[1],u[1],u[0]],V.mul(cr,-1),postSide);
          quad([b[1],b[2],u[2],u[1]],al,postSide);
          quad([b[2],b[3],u[3],u[2]],cr,postSide);
          quad([b[3],b[0],u[0],u[3]],V.mul(al,-1),postSide);
        }
        acc2=s-L;
      }
    }
  }

  if(!pos.length) return null;
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  g.setAttribute('normal',new THREE.Float32BufferAttribute(nrm,3));
  const surface=new THREE.Mesh(g,new THREE.MeshLambertMaterial({
    map:fieldTex, vertexColors:true
  }));

  let posts=null;
  if(qPos.length){
    const pg=new THREE.BufferGeometry();
    pg.setAttribute('position',new THREE.Float32BufferAttribute(qPos,3));
    pg.setAttribute('color',new THREE.Float32BufferAttribute(qCol,3));
    pg.setAttribute('normal',new THREE.Float32BufferAttribute(qNrm,3));
    posts=new THREE.Mesh(pg,new THREE.MeshLambertMaterial({vertexColors:true}));
  }
  return {surface,posts,zones:zones.length,parcels:parcelCount,fences:fenceCount,
          tiles:farm.length};
}

/* ============================================================================
   4c. FORESTS  —  a low-poly mesh of individual trees, not a stamped slab.
   Every tree is a small faceted crown: three tapering rings plus an apex,
   five or six sides, each vertex nudged off the ideal cone so no two trees
   match. The pixel-art look comes from the SHADING, not a texture: each band
   of the crown takes one flat colour from a four-step ramp (dark skirt, two
   mids, warm highlight at the tip), faces are flat-shaded, and a per-facet
   brightness jitter stands in for dithering.

   Trees are planted on a jittered grid whose pitch is SMALLER than a crown,
   so neighbouring crowns interpenetrate and the wood reads as one bumpy mass
   — the same merging the reference art gets from overlapping sprites, except
   the mesh does it for free. A tree may only ROOT on a forest tile, but its
   crown is never clipped, so the treeline spills past the hex border and the
   silhouette stays organic. A few stunted bushes scattered just outside the
   wood's edge break the outline up further.
   ========================================================================== */
const CANOPY = {
  body:'#3a7a26',                  // the commonest crown green, ~half the wood
  zones:['#6a8d25','#78a226'],     // hue patches laid over it, in broad zones
  rim:'#225d1d',                   // reference tones only: the dark skirt and
  side:'#1d4f18'                   // flank are now derived by scaling the base
};
const CROWN_PX      = 10;    // width of one tree crown, world px
const CROWN_STEP    = 5;     // planting pitch: below CROWN_PX, so crowns overlap
const CROWN_JIT     = 2.0;   // how far a tree wanders off its slot
const TREE_H_PX     = 7.0;   // typical crown height, world px
const TREE_SINK_PX  = 1.2;   // buried this deep, so no crown ever hovers
const FOREST_TOP_PX = 15;    // the tallest anything grows; outlines clear this
const BUSH_MARGIN_PX= 6.0;   // strays may root this far outside the wood
const BUSH_CHANCE   = 0.14;  // ...with this probability per slot, so they are rare
const CANOPY_ZONE_F = 7.0;   // frequency of the hue patches: ~2 tiles across

/* Crown scale runs wide — a wood of near-identical blobs reads as texture, not
   as trees. Half the spread is per-tree, half comes from a slow field, so big
   and small trees fall into stands rather than salt-and-pepper. */
const TREE_MIN = 0.55, TREE_MAX = 1.60;
const VIGOUR_F = 11.0;

/* The understory: a dark disc laid on the ground under every crown, a little
   wider than the crown itself. Overlapping discs merge into ONE blob with a
   scalloped edge, so gaps between crowns show shadowed floor instead of bright
   grass, and the wood gets a single outline instead of one rim per tree. This
   is what makes a scatter of crowns read as a connected canopy. */
const FLOOR_R_MIN   = 4.9;   // never smaller than this, or the blob breaks up
const FLOOR_GROW    = 1.15;  // ...and always this much wider than its crown
const FLOOR_LIFT_PX = 0.5;
const FLOOR_SHADE   = 0.40;
/* Wider than the farmland cap. Farmland needs gnomonic projection for exact
   polygon clipping and that distorts fast; the planting grid uses the
   equal-distance mapping, which only loses sin(p)/p across — 6% out here — so
   the zone can be much bigger, and a big zone is one that never has to be
   joined to a neighbour. */
const FOREST_SPAN = 0.60;
const WOOD_SHARE  = 0.20;  // share of land that starts out as forest

/* Quantiles of the zoning noise taken over the whole sphere, not per zone, so
   the colour field is one continuous thing that happens to be sampled by
   several zones. Directions come off a deterministic spiral, which covers the
   sphere evenly for any count. */
function canopyBands(seed){
  const N=512, v=new Float32Array(N);
  for(let i=0;i<N;i++){
    const z=1-2*(i+0.5)/N, r=Math.sqrt(Math.max(0,1-z*z)), a=i*2.39996323;
    v[i]=fbm3([r*Math.cos(a),r*Math.sin(a),z],seed,2,CANOPY_ZONE_F);
  }
  v.sort();
  return [v[Math.floor(N*0.50)], v[Math.floor(N*0.78)]];
}

function buildForest(tiles,PX,seed){
  const Z=coverZones(tiles,'forest',FOREST_SPAN);
  if(!Z.total) return null;
  const {zones,zoneOf}=Z;
  const [t1,t2]=canopyBands(seed);

  const pos=[],col=[],nrm=[];
  const baseCols=[CANOPY.body,...CANOPY.zones].map(h=>rgb(h).map(v=>v/255));
  let treeCount=0;

  /* Crown profile as (height, radius) fractions: bottom ring tucked in so the
     skirt reads as the dark outline, widest at two thirds, doming to the apex.
     BAND_SH is the flat shade of each band of faces, skirt to tip. */
  const RINGS=[{y:-0.10,r:0.55},{y:0.30,r:0.92},{y:0.60,r:1.00},{y:0.85,r:0.60}];
  const BAND_SH=[0.38,0.62,0.88,1.18];
  const floorCol=c=>[c[0]*FLOOR_SHADE,c[1]*FLOOR_SHADE,c[2]*FLOOR_SHADE];

  const emit=(p,n,c)=>{
    pos.push(p[0],p[1],p[2]); nrm.push(n[0],n[1],n[2]); col.push(c[0],c[1],c[2]);
  };
  /* Rings are built CCW seen from above with (a1,a2,up) right-handed, which
     makes this winding outward-facing for every band, the fan and the cap. */
  const tri=(A,B,C,c)=>{
    const n=V.norm(V.cross(V.sub(B,A),V.sub(C,A)));
    emit(A,n,c); emit(B,n,c); emit(C,n,c);
  };
  const inHull=(h,q)=>{
    for(let k=0;k<h.length;k++){
      const A=h[k],B=h[(k+1)%h.length];
      if((B[0]-A[0])*(q[1]-A[1])-(B[1]-A[1])*(q[0]-A[0])<-1e-12) return false;
    }
    return true;
  };

  function addTree(g,a1,a2,up,r,h,sides,base,bright,kx,ky,kz){
    const rings=[];
    for(let j=0;j<RINGS.length;j++){
      const pts=[], tw=j*0.45+hash3i(kx+j,ky,kz)*0.6;   // slight twist per ring
      for(let i=0;i<sides;i++){
        const a=i/sides*Math.PI*2+tw;
        const jr=1+(hash3i(kx*3+i,ky*5+j,kz)-0.5)*0.18;  // off the perfect cone
        const rr=r*RINGS[j].r*jr;
        pts.push(V.add(g,V.add(V.mul(up,h*RINGS[j].y),
                 V.add(V.mul(a1,Math.cos(a)*rr),V.mul(a2,Math.sin(a)*rr)))));
      }
      rings.push(pts);
    }
    const apex=V.add(g,V.add(V.mul(up,h),
      V.add(V.mul(a1,(hash3i(kx,ky,kz+401)-0.5)*r*0.6),    // a little lean
            V.mul(a2,(hash3i(kx,ky,kz+407)-0.5)*r*0.6))));
    const shade=(sh,warm,f)=>{
      const j=bright*(0.975+hash3i(kx+f,ky-f,kz+501)*0.05); // a facet = a dither
      return [Math.min(1,base[0]*sh*j+warm*0.09),
              Math.min(1,base[1]*sh*j+warm*0.11),
              Math.min(1,base[2]*sh*j)];
    };
    let f=0;
    for(let j=0;j<RINGS.length-1;j++){
      const warm=j===RINGS.length-2?0.4:0;
      for(let i=0;i<sides;i++){
        const i2=(i+1)%sides;
        const A=rings[j][i],B=rings[j][i2],C=rings[j+1][i2],D=rings[j+1][i];
        tri(A,B,C,shade(BAND_SH[j],warm,f++));
        tri(A,C,D,shade(BAND_SH[j],warm,f++));
      }
    }
    const top=RINGS.length-1;
    for(let i=0;i<sides;i++)
      tri(rings[top][i],rings[top][(i+1)%sides],apex,shade(BAND_SH[top],1,f++));
    // underside cap, so a crown caught at the horizon is never hollow
    const c0=V.add(g,V.mul(up,h*RINGS[0].y)), cc=shade(BAND_SH[0],0,f++);
    for(let i=0;i<sides;i++) tri(rings[0][(i+1)%sides],rings[0][i],c0,cc);
  }

  /* Seven sides, not six: an odd count keeps the disc from lining up with the
     hex grid underneath it. Radius wobbles per disc so the merged outline is
     lumpy rather than a chain of circles. */
  function addFloor(g,a1,a2,up,r,base,kx,ky,kz){
    const N=7, c=floorCol(base);
    const mid=V.add(g,V.mul(up,FLOOR_LIFT_PX*PX));
    const spin=hash3i(kx,ky,kz+61)*Math.PI*2;
    const pts=[];
    for(let i=0;i<N;i++){
      const a=i/N*Math.PI*2+spin;
      const rr=r*(1+(hash3i(kx*7+i,ky*11,kz+83)-0.5)*0.22);
      pts.push(V.add(mid,V.add(V.mul(a1,Math.cos(a)*rr),V.mul(a2,Math.sin(a)*rr))));
    }
    for(let i=0;i<N;i++) tri(mid,pts[i],pts[(i+1)%N],c);
  }

  zones.forEach((zone,zi)=>{
    const F=zoneFrame(zone,29), e1=F.e1, e2=F.e2, to2=F.to2e, to3=F.to3e;

    const zh=zone.map(t=>{
      const h=t.corners.map(to2);
      return polyArea(h)<0?h.slice().reverse():h;
    });

    /* One ring of land around the wood, for the stray bushes. Each bush tile
       remembers which of its edges touch the zone; a bush may only root
       within BUSH_MARGIN_PX of one of those edges. */
    const bushes=[], bSeen=new Set(zone.map(t=>t.id));
    for(const t of zone) for(const j of t.neighbors){
      if(bSeen.has(j)) continue; bSeen.add(j);
      const n=tiles[j];
      if(n.level<0) continue;                            // nothing roots at sea
      let h=n.corners.map(to2), ze=[];
      for(let k=0;k<n.sides;k++) ze.push(zoneOf[n.edgeNeighbors[k]]===zi);
      if(!ze.some(x=>x)) continue;
      if(polyArea(h)<0){
        h=h.slice().reverse();
        const N=n.sides, z2=new Array(N);
        for(let k=0;k<N;k++) z2[k]=ze[(N-2-k+N)%N];
        ze=z2;
      }
      bushes.push({t:n,h,ze});
    }

    let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
    for(const h of [...zh,...bushes.map(b=>b.h)]) for(const q of h){
      if(q[0]<x0)x0=q[0]; if(q[0]>x1)x1=q[0];
      if(q[1]<y0)y0=q[1]; if(q[1]>y1)y1=q[1];
    }
    const step=CROWN_STEP*PX, margin=BUSH_MARGIN_PX*PX;
    const gi0=Math.floor(x0/step)-1, gi1=Math.ceil(x1/step)+1;
    const gj0=Math.floor(y0/step)-1, gj1=Math.ceil(y1/step)+1;

    for(let sj=gj0;sj<=gj1;sj++) for(let si=gi0;si<=gi1;si++){
      const q=[(si+0.5+(hash3i(si,sj,seed|0)-0.5)*CROWN_JIT/CROWN_STEP)*step,
               (sj+0.5+(hash3i(si,sj,(seed|0)+977)-0.5)*CROWN_JIT/CROWN_STEP)*step];
      let t=null, bush=false;
      for(let i=0;i<zh.length;i++) if(inHull(zh[i],q)){t=zone[i];break;}
      if(!t){
        for(const b of bushes){
          let inside=true, near=false;
          for(let k=0;k<b.h.length;k++){
            const A=b.h[k],B=b.h[(k+1)%b.h.length];
            const dx=B[0]-A[0],dy=B[1]-A[1],L=Math.hypot(dx,dy)||1;
            const ins=(-(q[0]-A[0])*dy+(q[1]-A[1])*dx)/L;  // inset from edge k
            if(ins<-1e-9){inside=false;break;}
            if(b.ze[k]&&ins<=margin) near=true;
          }
          if(inside&&near){t=b.t;bush=true;break;}
        }
        if(!t) continue;
        if(hash3i(si,sj,(seed|0)+2311)>BUSH_CHANCE) continue;
      }

      const kz=(seed|0)+zi*733;
      const pl=facetPlane(t), dir=to3(q);
      /* Root on the tile's FACET plane along this ray — the same rule the
         fields use, so a tree near a hex seam agrees with its neighbour. */
      let g=V.mul(dir,pl.d*t.radius/V.dot(dir,pl.n));
      const up=V.norm(g);
      let a1=V.sub(e1,V.mul(up,V.dot(e1,up)));
      if(V.len(a1)<1e-6) a1=V.sub(e2,V.mul(up,V.dot(e2,up)));
      a1=V.norm(a1);
      const rot=hash3i(si,sj,kz+31)*Math.PI*2;
      const a1r=V.add(V.mul(a1,Math.cos(rot)),V.mul(V.cross(up,a1),Math.sin(rot)));
      const a2r=V.cross(up,a1r);                       // (a1r,a2r,up) right-handed

      const h4=hash3i(si,sj,kz+57), h5=hash3i(si,sj,kz+91), h6=hash3i(si,sj,kz+137);

      /* Half the size spread is this tree's own roll, half is a slow field, so
         big trees gather into stands instead of peppering the wood evenly. */
      const vig=fbm3(dir,(seed|0)^0x5bf,2,VIGOUR_F);
      const clump=Math.min(1,Math.max(0,(vig-0.34)/0.32));
      const sz=TREE_MIN+(TREE_MAX-TREE_MIN)*(0.45*clump+0.55*h4);

      let r=CROWN_PX*0.5*PX*sz;
      let hh=TREE_H_PX*PX*sz*(0.90+h5*0.20);
      let bright=0.96+hash3i(si,sj,kz+211)*0.08;
      if(bush){ r*=0.45+h6*0.45; hh*=0.50+h6*0.45; }   // strays: saplings to small trees
      else if(h6<0.07){ hh*=1.35; r*=0.88; bright*=0.92; }  // one emergent per stand
      g=V.sub(g,V.mul(up,TREE_SINK_PX*PX*(bush?0.6:1)));

      // hue patches from the GLOBAL field, so colour never steps at a zone join
      const v=fbm3(dir,seed,2,CANOPY_ZONE_F);
      const base=baseCols[v<t1?0:v<t2?1:2];
      const sides=5+Math.floor(hash3i(si,sj,kz+257)*1.999);

      /* Inside the wood the disc has a floor size, which is what welds the
         canopy together. A stray keeps its own small disc so it reads as one
         tree standing alone, not as an outlier of the mass. */
      const fr=bush ? r*FLOOR_GROW
                    : Math.max(r,FLOOR_R_MIN*PX)*FLOOR_GROW;
      addFloor(g,a1r,a2r,up,fr,base,si,sj,kz);
      addTree(g,a1r,a2r,up,r,hh,sides,base,bright,si,sj,kz);
      treeCount++;
    }
  });

  if(!pos.length) return null;
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  g.setAttribute('normal',new THREE.Float32BufferAttribute(nrm,3));
  const surface=new THREE.Mesh(g,new THREE.MeshLambertMaterial({vertexColors:true}));
  return {surface,zones:zones.length,tiles:Z.total,crowns:treeCount};
}

/* ============================================================================
   4d. HOUSES  —  zoned like fields and forest, but a village wants ORDER where
   a wood wants scatter. So the whole connected zone picks one bearing out of
   three — along the grid, across it, or diagonal — and every roof ridge in the
   village runs that way. Footprints still vary, which is what keeps a regular
   street grid from reading as graph paper.

   Each house is walls plus a 45-degree gable that overhangs by ROOF_OVER and
   carries a ROOF_LIP fascia at the eave, so the roof reads as a slab with
   thickness rather than a sheet folded over a box. Doors and windows are decal
   quads floated a hair off the wall — cheaper than cutting the wall into a
   grid of panels, and at this scale indistinguishable.
   ========================================================================== */
const HOUSE_WALLS = ['#e7ddc8','#dcd0b8','#cfc2a8','#e2d5bd'];
