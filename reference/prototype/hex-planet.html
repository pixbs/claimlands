// one roof, straight off the reference: brick red with its own shadow tone
const HOUSE_ROOF = {a:'#a24b32', b:'#823a26'};
const HOUSE_OPEN = '#453227';    // doors and windows are the same single colour

/* Scale is set against the ground, not against the screen: a hex measures
   about 22.5 world px across, so a house has to sit near 5 to fit a village
   into a tile. Everything else follows from that — a 2px door is a third of
   the facade and a window is a single pixel, which is the right proportion
   for a building this size in pixel art. */
const PLOT_PX    = 9.0;   // street grid pitch, world px
const PLOT_JIT   = 1.0;
/* SPAN is across the ridge and LEN is along it. Because the gable peak sits at
   wt + SPAN/2, anything that widens a house also makes it taller — so keeping
   the roofline of a village even means holding BOTH span and wall height to a
   narrow range, and putting the variety into length instead.
   Length is rolled in whole world pixels so the differences land on the art
   grid: neighbours come out 1, 2, 3 or 4 px apart rather than 2.7. */
const HOUSE_SPAN_MIN = 4.0, HOUSE_SPAN_MAX = 5.0;
const HOUSE_LEN_MIN  = 4,   HOUSE_LEN_MAX  = 8;    // whole world px, inclusive
const WALL_MIN   = 3.2, WALL_MAX = 4.2;
const ROOF_OVER  = 1;     // eave overhang past the wall, world px
/* Slab thickness measured PERPENDICULAR to the pitch. Offsetting the top
   surface vertically by this instead leaves only LIP*cos45 = 0.71px of edge,
   which is why the roof read as thinner than a pixel. */
const ROOF_LIP   = 1;
const STRIPE_PX  = 2;     // one course, measured ALONG the ridge
const RIDGE_CAP_PX = 1.5; // the single band capping the ridge
const STRIPE_ODDS= 0.55;  // decided per HOUSE, so a village mixes both
const VERGE_PX   = 1;     // wall-coloured trim down each gable edge...
const VERGE_ODDS = 0.20;  // ...on this share of roofs
const DOOR_W     = 2, DOOR_H = 2.0;
const WIN_PX     = 1.0;
const CHIM_PX    = 1.5;
/* Rise is what SHOWS above the tiles, measured from the roof surface at the
   chimney's own position rather than from the ridge. Off the ridge those differ
   by nearly half the span, which is why chimneys out on a pitch came out long. */
const CHIM_RISE_MIN = 1.0, CHIM_RISE_MAX = 2.5;
const CHIM_ODDS  = 0.80;  // a fifth of houses have no chimney at all
const L_CHANCE   = 0.18;
const HOUSE_SINK = 0.6;
const HOUSE_ODDS = 0.85;  // empty plots become yards and streets
const HOUSE_SPAN = 0.50;
const HOUSE_TOP_PX = 14;  // tallest chimney; outlines clear this
const TOWN_SHARE = 0.08;
/* Each house picks its own quarter turn, so a village holds ridges running
   four ways rather than one. A few degrees of play on top keeps the rows from
   looking machined. */
const HOUSE_TURNS = [0, Math.PI/4, Math.PI/2, 3*Math.PI/4];
const HOUSE_ROT_JIT = 0.06;

function buildHouses(tiles,PX,seed){
  const Z=coverZones(tiles,'houses',HOUSE_SPAN);
  if(!Z.total) return null;
  const {zones}=Z;

  const pos=[],col=[],nrm=[];
  let houseCount=0, wingCount=0;
  const C=s=>rgb(s).map(v=>v/255);
  const wallSet=HOUSE_WALLS.map(C);
  const roof={a:C(HOUSE_ROOF.a),b:C(HOUSE_ROOF.b)};
  const openC=C(HOUSE_OPEN);

  const emit=(p,n,c)=>{
    pos.push(p[0],p[1],p[2]); nrm.push(n[0],n[1],n[2]); col.push(c[0],c[1],c[2]);
  };
  /* Winding is fixed against a supplied outward direction rather than tracked
     by hand. A house has 30-odd faces pointing six ways; deriving each one's
     winding from its normal is the difference between this working first try
     and hunting inside-out quads for an hour. */
  const face=(ring,c,out)=>{
    let n=ringNormal(ring), r=ring;
    if(V.dot(n,out)<0){ r=ring.slice().reverse(); n=V.mul(n,-1); }
    for(let i=1;i<r.length-1;i++){ emit(r[0],n,c); emit(r[i],n,c); emit(r[i+1],n,c); }
  };

  /* One building. The gable END is WALL, cut as the classic five-sided house
     silhouette, and the roof is only the two pitches laid over it — a caret,
     not a solid triangular block. The roof underside meets the wall exactly at
     `wt`, so the eave overhangs without opening a slot into the interior. */
  function addBuilding(g,ax,az,up,w,d,wt,wall,striped,verge,kx,ky,kz,front){
    const P=(x,y,z)=>V.add(g,V.add(V.mul(ax,x),V.add(V.mul(up,y),V.mul(az,z))));
    const hw=w/2, hd=d/2;
    const W=hw+ROOF_OVER*PX, D=hd+ROOF_OVER*PX;
    const eb=wt-ROOF_OVER*PX;        // eave, underside
    /* A 45-degree pitch needs LIP*sqrt2 of VERTICAL offset to end up LIP thick
       measured square to the slope. That factor is the whole fix for a roof
       edge that came out 0.71px instead of 1. */
    const et=eb+ROOF_LIP*Math.SQRT2*PX;
    const rt=et+W, rb=eb+W;          // ridge, top and underside
    /* The eave is cut SQUARE TO THE PITCH, not vertically. A vertical cut is
       what makes the gable-end caret read as the dull chevron: its arms end in
       an upright face, so the silhouette blunts off. Cutting perpendicular puts
       a 45-degree mitre on the arm and the caret comes to a proper point.
       Sliding the underside corner in by LIP/sqrt2 and up by the same amount is
       that cut: the segment it leaves is exactly ROOF_LIP long in the plane of
       the cut, so the visible roof edge is one world pixel rather than the 1.41
       a vertical face gave. */
    const mit=ROOF_LIP*PX/Math.SQRT2;

    // long walls
    for(const s of [-1,1])
      face([P(s*hw,0,-hd),P(s*hw,0,hd),P(s*hw,wt,hd),P(s*hw,wt,-hd)],wall,V.mul(ax,s));
    // gable walls: the peak is wall, not roof
    for(const e of [-1,1])
      face([P(-hw,0,e*hd),P(hw,0,e*hd),P(hw,wt,e*hd),P(0,wt+hw,e*hd),P(-hw,wt,e*hd)],
           wall,V.mul(az,e));

    /* Courses run ALONG the ridge, so on the slope they read as vertical
       stripes, and a single band caps the ridge across the top. */
    const capF=Math.min(0.5,RIDGE_CAP_PX*PX/W);
    const vg=verge?VERGE_PX*PX:0, zIn=Math.max(D*0.25,D-vg);
    const M=Math.max(2,Math.round(2*zIn/(STRIPE_PX*PX)));
    for(const s of [-1,1]){
      const out=V.norm(V.add(V.mul(ax,s),up));
      const xE=s*W, xC=s*W*capF, yC=et+W*(1-capF);
      for(let i=0;i<M;i++){
        const z0=-zIn+2*zIn*i/M, z1=-zIn+2*zIn*(i+1)/M;
        const c=(striped&&(i&1))?roof.b:roof.a;
        face([P(xE,et,z0),P(xE,et,z1),P(xC,yC,z1),P(xC,yC,z0)],c,out);
      }
      // wall-coloured trim down each gable edge, eave to ridge
      if(verge) for(const e of [-1,1]){
        face([P(xE,et,e*zIn),P(xE,et,e*D),P(xC,yC,e*D),P(xC,yC,e*zIn)],wall,out);
        face([P(xC,yC,e*zIn),P(xC,yC,e*D),P(0,rt,e*D),P(0,rt,e*zIn)],wall,out);
      }
      face([P(xC,yC,-zIn),P(xC,yC,zIn),P(0,rt,zIn),P(0,rt,-zIn)],roof.b,out);  // ridge cap
      /* Underside, and the mitred edge that gives the roof its 1px depth.
         Where a verge runs, the spans of that edge beneath it take the WALL
         tone: this face is the depth side of the wall-coloured trim, and
         leaving it roof-red was the join showing through. */
      const xB=s*(W-mit), yB=eb+mit;
      face([P(xB,yB,-D),P(xB,yB,D),P(0,rb,D),P(0,rb,-D)],roof.b,V.mul(out,-1));
      const edgeOut=V.norm(V.sub(V.mul(ax,s),up));
      const band=(z0,z1,c)=>
        face([P(s*W,et,z0),P(s*W,et,z1),P(xB,yB,z1),P(xB,yB,z0)],c,edgeOut);
      if(verge){ band(-D,-zIn,wall); band(-zIn,zIn,roof.b); band(zIn,D,wall); }
      else band(-D,D,roof.b);
    }
    /* The gable-end caret. Its outer corner is the mitred one, so each arm ends
       in a 45-degree point. Wall-coloured when the roof carries a verge, since
       this whole face is the depth side of that trim. */
    for(const e of [-1,1]) for(const s of [-1,1])
      face([P(s*W,et,e*D),P(0,rt,e*D),P(0,rb,e*D),P(s*(W-mit),eb+mit,e*D)],
           verge?wall:roof.b,V.mul(az,e));

    /* Openings, floated DECAL off the wall. Every house gets a door on its
       front; windows fill whatever wall length is left over. */
    const DEC=0.12*PX;
    const panel=(o,off,hx,u,v,pw,ph,c)=>{
      const b=V.mul(o,off+DEC);
      face([V.add(g,V.add(b,V.add(V.mul(hx,u-pw/2),V.mul(up,v)))),
            V.add(g,V.add(b,V.add(V.mul(hx,u+pw/2),V.mul(up,v)))),
            V.add(g,V.add(b,V.add(V.mul(hx,u+pw/2),V.mul(up,v+ph)))),
            V.add(g,V.add(b,V.add(V.mul(hx,u-pw/2),V.mul(up,v+ph))))],c,o);
    };
    const sides=[{o:V.mul(az,-1),off:hd,hx:ax,len:w},
                 {o:az,          off:hd,hx:ax,len:w},
                 {o:V.mul(ax,-1),off:hw,hx:az,len:d},
                 {o:ax,          off:hw,hx:az,len:d}];
    const fs=sides[front];
    const doorU=(hash3i(kx,ky,kz+11)-0.5)*Math.max(0,fs.len-(DOOR_W+1)*PX);
    panel(fs.o,fs.off,fs.hx,doorU,0,DOOR_W*PX,DOOR_H*PX,openC);
    sides.forEach((s,si)=>{
      const n=Math.max(1,Math.min(3,Math.floor(s.len/(2.6*PX))));
      for(let i=0;i<n;i++){
        const u=((i+0.5)/n-0.5)*s.len*0.78;
        if(si===front && Math.abs(u-doorU)<(DOOR_W+WIN_PX)*0.6*PX) continue;
        panel(s.o,s.off,s.hx,u,wt*0.45,WIN_PX*PX,WIN_PX*PX,openC);
      }
    });

    // chimney, in the wall material, poking through one pitch
    if(hash3i(kx,ky,kz+97)<CHIM_ODDS){
      const cs=hash3i(kx,ky,kz+53)>0.5?1:-1;
      const cx=cs*W*0.45, cz=(hash3i(kx,ky,kz+59)-0.5)*d*0.5;
      const rise=CHIM_RISE_MIN+(CHIM_RISE_MAX-CHIM_RISE_MIN)*hash3i(kx,ky,kz+101);
      const ch=CHIM_PX*PX*0.5;
      // the pitch surface here is et + W - |x|, so `rise` is what is actually seen
      const ctop=et+W-Math.abs(cx)+rise*PX;
      for(const [ox,oz,o] of [[ch,0,ax],[-ch,0,V.mul(ax,-1)],[0,ch,az],[0,-ch,V.mul(az,-1)]]){
        const a=ox?[cx+ox,cz-ch]:[cx-ch,cz+oz], b=ox?[cx+ox,cz+ch]:[cx+ch,cz+oz];
        face([P(a[0],eb,a[1]),P(b[0],eb,b[1]),P(b[0],ctop,b[1]),P(a[0],ctop,a[1])],wall,o);
      }
      face([P(cx-ch,ctop,cz-ch),P(cx+ch,ctop,cz-ch),
            P(cx+ch,ctop,cz+ch),P(cx-ch,ctop,cz+ch)],wall,up);
    }
  }

  zones.forEach((zone,zi)=>{
    const F=zoneFrame(zone,71), e1=F.e1, e2=F.e2, to2=F.to2e, to3=F.to3e;
    const kz=(seed|0)+zi*617;
    // one wall tone per village, so a settlement is built of one thing
    const wall=wallSet[Math.floor(hash3i(zone[0].id,zone.length,kz+3)*wallSet.length*0.999)];

    const zh=zone.map(t=>{
      const q=t.corners.map(to2);
      return polyArea(q)<0?q.slice().reverse():q;
    });
    let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
    for(const q of zh) for(const r of q){
      if(r[0]<x0)x0=r[0]; if(r[0]>x1)x1=r[0];
      if(r[1]<y0)y0=r[1]; if(r[1]>y1)y1=r[1];
    }
    const step=PLOT_PX*PX;
    const gi0=Math.floor(x0/step)-1, gi1=Math.ceil(x1/step)+1;
    const gj0=Math.floor(y0/step)-1, gj1=Math.ceil(y1/step)+1;

    for(let sj=gj0;sj<=gj1;sj++) for(let si=gi0;si<=gi1;si++){
      const q=[(si+0.5+(hash3i(si,sj,kz+3)-0.5)*PLOT_JIT/PLOT_PX)*step,
               (sj+0.5+(hash3i(si,sj,kz+9)-0.5)*PLOT_JIT/PLOT_PX)*step];
      const hi=hullAt(zh,q);
      if(hi<0) continue;
      if(hash3i(si,sj,kz+17)>HOUSE_ODDS) continue;
      const t=zone[hi];

      const pl=facetPlane(t), dir=to3(q);
      let g=V.mul(dir,pl.d*t.radius/V.dot(dir,pl.n));
      const up=V.norm(g);
      let a1=V.sub(e1,V.mul(up,V.dot(e1,up)));
      if(V.len(a1)<1e-6) a1=V.sub(e2,V.mul(up,V.dot(e2,up)));
      a1=V.norm(a1);
      // this house's own quarter turn, plus a few degrees of play
      const rot=HOUSE_TURNS[Math.floor(hash3i(si,sj,kz+71)*3.999)]
              + (hash3i(si,sj,kz+79)-0.5)*2*HOUSE_ROT_JIT;
      const ax=V.add(V.mul(a1,Math.cos(rot)),V.mul(V.cross(up,a1),Math.sin(rot)));
      const az=V.cross(up,ax);
      g=V.sub(g,V.mul(up,HOUSE_SINK*PX));

      const w=(HOUSE_SPAN_MIN+(HOUSE_SPAN_MAX-HOUSE_SPAN_MIN)*hash3i(si,sj,kz+23))*PX;
      const steps=HOUSE_LEN_MAX-HOUSE_LEN_MIN+1;
      const d=(HOUSE_LEN_MIN+Math.floor(hash3i(si,sj,kz+31)*steps*0.999))*PX;
      const wt=(WALL_MIN+(WALL_MAX-WALL_MIN)*hash3i(si,sj,kz+37))*PX;
      const front=Math.floor(hash3i(si,sj,kz+61)*3.999);
      const striped=hash3i(si,sj,kz+13)<STRIPE_ODDS;
      const verge=hash3i(si,sj,kz+19)<VERGE_ODDS;

      addBuilding(g,ax,az,up,w,d,wt,wall,striped,verge,si,sj,kz,front);
      houseCount++;

      /* A wing, set at right angles and a touch lower, turns the box into an
         L. It shares walls and roof so the two read as one building. */
      if(hash3i(si,sj,kz+67)<L_CHANCE){
        // the wing keeps the main span, so the two roofs sit at the same height
        const w2=w, d2=(3+Math.floor(hash3i(si,sj,kz+83)*2.999))*PX;
        const off=V.add(V.mul(ax,(w/2-d2/2)*0.9),V.mul(az,(d/2+w2/2)-w2*0.35));
        addBuilding(V.add(g,off),az,V.mul(ax,-1),up,w2,d2,wt*0.95,
                    wall,striped,verge,si+911,sj,kz,1);
        wingCount++;
      }
    }
  });

  if(!pos.length) return null;
  const bg=new THREE.BufferGeometry();
  bg.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  bg.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  bg.setAttribute('normal',new THREE.Float32BufferAttribute(nrm,3));
  const surface=new THREE.Mesh(bg,new THREE.MeshLambertMaterial({vertexColors:true}));
  return {surface,zones:zones.length,tiles:Z.total,houses:houseCount,wings:wingCount};
}

/* ============================================================================
   CLOUDS.  The seam problem: if every tile sampled the same cell of a shared
   atlas, the identical blob would appear in all 642 hexes. So each tile gets
   its OWN 24x24 cell, rasterised by walking that cell's texels, mapping each
   one back to the direction on the sphere it actually covers, and sampling one
   continuous 3D noise field there. Neighbouring tiles read the same field over
   the same shared edge, so the pattern crosses tile borders unbroken and never
   repeats anywhere on the planet.
   ========================================================================== */
function hash3i(x,y,z){
  let n=Math.imul(x,374761393)^Math.imul(y,668265263)^Math.imul(z,1103515245);
  n=Math.imul(n^(n>>>13),1274126177);
  return ((n^(n>>>16))>>>0)/4294967296;
}

function vnoise3(x,y,z){
  const xi=Math.floor(x), yi=Math.floor(y), zi=Math.floor(z);
  const xf=x-xi, yf=y-yi, zf=z-zi;
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf), w=zf*zf*(3-2*zf);
  const L=(a,b,t)=>a+(b-a)*t;
  const c=(i,j,k)=>hash3i(xi+i,yi+j,zi+k);
  return L(L(L(c(0,0,0),c(1,0,0),u), L(c(0,1,0),c(1,1,0),u), v),
           L(L(c(0,0,1),c(1,0,1),u), L(c(0,1,1),c(1,1,1),u), v), w);
}

const FBM_OCT=4, FBM_F0=3.4;
function fbm3(p,seed,oct,f0){
  oct=oct||FBM_OCT; f0=f0||FBM_F0;
  let s=0,a=0.5,f=f0,norm=0;
  for(let i=0;i<oct;i++){
    s+=a*vnoise3(p[0]*f+seed, p[1]*f+seed*1.7, p[2]*f+seed*2.3);
    norm+=a; f*=2.07; a*=0.5; seed+=11;
  }
  return s/norm;
}

/* Exact inverse of uvOf: which direction does the texel at cell (px,py) cover?
   The reconstructed point is placed on the tile's FACET PLANE, not on a tangent
   plane or the sphere. That matters: two neighbouring facets intersect along
   exactly their shared edge, so a texel on that edge resolves to the identical
   point from either side, and the noise cannot disagree there. */
function texelDir(t,px,py,pl){
  const x=((px+0.5)/(TILE_PX/2)-1)/UV_INSET;
  const y=(1-(py+0.5)/(TILE_PX/2))/UV_INSET;
  const R=t.unitCircum;
  const tang=V.add(V.mul(t.e1,x*R),V.mul(t.e2,y*R));
  const hgt=(pl.d-V.dot(tang,pl.n))/pl.dc;      // slide along centre onto the plane
  return V.norm(V.add(tang,V.mul(t.center,hgt)));
}

/* The facet plane of a tile, in unit-sphere scale. */
function facetPlane(t){
  const n=t.normal;
  let d=0;
  for(const c of t.corners) d+=V.dot(c,n);
  return {n, d:d/t.sides, dc:V.dot(t.center,n)};
}

/* ============================================================================
   SKY.  Three cloud decks, each on its own hexsphere shell a little above the
   last, so a cloud reads as a stepped mound rather than a flat decal.

   The clouds have to DRIFT while the shells stay put, and that decides the
   whole design. Re-rasterising the old per-tile atlas was measured at 200-400ms
   per pass, so moving the pattern on the CPU is out; it has to be a texture
   offset on the GPU. But a texture offset only equals a rotation of the planet's
   sky if the mapping is cylindrical about the drift axis — under the old
   per-tile mapping each hex would slide its own way and the pattern would tear
   at every border. So the decks are mapped cylindrically instead, and the
   texture is generated by sampling the same 3D field at the direction each texel
   actually covers. That second part is what keeps it undistorted: an ordinary 2D
   noise stretched over a cylinder smears at the poles, whereas a field sampled
   through the mapping is simply over-sampled there, which costs nothing.

   Equal-area in latitude (v tracks sin, not the angle), so one texel covers one
   world pixel of sky everywhere rather than only at the equator.
   ========================================================================== */
const CLOUD_LIFT_PX = 2;      // each deck sits this far above the one below
/* Outer deck first, each stated as the share of sky it covers. Coverage rather
   than a field threshold, because thresholds spaced evenly up the noise are
   spaced very unevenly in area — the top deck came out at one per cent of the
   sky, a speck instead of a summit. Each deck sits strictly inside the one
   below, so the stack terraces inward. */
const CLOUD_DECKS = [
  {tone:'#b9d4e8', cover:0.38},
  {tone:'#dceaf5', cover:0.20},
  {tone:'#ffffff', cover:0.09}
];
const CLOUD_OCT = 3, CLOUD_F0 = 3.4;
/* Fixed size, not derived from the world pixel. One sky is shared by every
   world size, so deriving it from whichever size happened to ask first made the
   resolution depend on how fast the player moved the slider. 928 puts one texel
   on one world pixel at the default size; larger worlds get a slightly coarser
   sky, smaller ones a finer one. A multiple of four, so the 4x4 dither wraps
   without a seam where the sky joins itself. */
const CLOUD_TEX_W = 928;
const CLOUD_DRIFT = 0.0016;   // turns per second: one lap in about ten minutes
/* Ordered 4x4 dither, stored as the alpha channel: rank r gets alpha (r+1)/16.
   One texel is one world pixel, so the holes that open up in a fading cloud are
   world-pixel sized.

   The fade then rides on OPACITY, not on alphaTest, and that is a three.js r128
   detail worth writing down: in this version alphaTest is compiled into the
   shader as a #define, so animating it would rebuild the program every frame.
   Opacity is a plain uniform. Since the shader multiplies texture alpha by
   opacity BEFORE the discard, dropping opacity raises the effective cut and
   knocks out the low dither ranks one at a time — the dissolve we want, for the
   cost of a uniform write. */
const BAYER4 = [0,8,2,10, 12,4,14,6, 3,11,1,9, 15,7,13,5];
const DITHER_RANKS = 16;
const DITHER_FLOOR = 0.030;
/* Stored alpha is the RECIPROCAL of the rank, not the rank itself: a texel
   survives while  seeThrough > (bayerRank + 0.5) / 16,  so the fraction that
   survives equals seeThrough exactly. Two things fall out of that. Untouched
   sky is completely solid — at seeThrough = 1 every one of the sixteen ranks
   clears the floor, so a cloud left alone shows no dither at all. And the
   dissolve is linear, where storing the rank straight (alpha proportional to
   rank) held coverage near 1 until it fell off a cliff. */
/* See-through: scrolling in opens a HOLE in the weather over whatever the
   camera is pointed at, rather than thinning the whole sky. The opening is a
   cap on the sphere centred on the sub-camera point, and because the dither
   pattern lives in the texture at one texel per world pixel, the rim of the
   hole breaks up into world-pixel speckle on its own — the further from the
   centre, the fewer ranks are knocked out, so the falloff reads as a radial
   dissolve rather than a soft edge.

   The range starts almost at full zoom-out and eases linearly, because the
   camera opens at 3.3 and closes at 1.35: a window of 3.0 to 1.7 meant the
   effect had not begun at the distance the app starts on, and squaring the
   fade held it off until the very last of the travel. */
const SEE_FAR = 6.0, SEE_NEAR = 5.0, SEE_MIN = 0.02;
const HOLE_DEG_FAR = 24, HOLE_DEG_NEAR = 64;  // angular radius of the opening
const HOLE_CORE = 0.40;   // inner share that opens fully; the rest is the rim

/* The sky is built ONCE and shared by every world size. It depends on the world
   pixel only for its resolution, and holding one per size would mean three
   textures times eleven sizes in memory for no visible gain. Sized from the
   first world that asks, which is the one the app opens on. */
let skyShared=null;
function cloudSky(seed){
  if(!skyShared) skyShared=makeCloudSky(seed);
  return skyShared;
}

function makeCloudSky(seed){
  /* Equal-area cylinder: the full sphere is 2pi wide by 2 tall, so the aspect
     is pi and W*H texels cover the sky evenly. */
  const W=CLOUD_TEX_W, H=4*Math.round(W/Math.PI/4);

  const field=new Float32Array(W*H);
  for(let j=0;j<H;j++){
    const sy=2*(j+0.5)/H-1, cy=Math.sqrt(Math.max(0,1-sy*sy));
    for(let i=0;i<W;i++){
      const lam=(i+0.5)/W*2*Math.PI;
      field[j*W+i]=fbm3([cy*Math.cos(lam),sy,cy*Math.sin(lam)],seed,CLOUD_OCT,CLOUD_F0);
    }
  }
  /* Each deck's threshold is a quantile of the texels themselves. Because the
     grid is equal-area every sample counts the same, so a quantile IS a share
     of sky — which the old per-tile sampling could not claim. */
  const stride=Math.max(1,Math.floor(field.length/40000));
  const probe=[];
  for(let i=0;i<field.length;i+=stride) probe.push(field[i]);
  probe.sort((a,b)=>a-b);

  /* Rank r survives down to seeThrough = (r+0.5)/16, so alpha = FLOOR*16/(r+0.5).
     Rank 0 lands at FLOOR*32, which is why FLOOR has to sit at or under 1/32. */
  const rankAlpha=BAYER4.map(b=>
    Math.round(255*Math.min(1,DITHER_FLOOR*DITHER_RANKS/(b+0.5))));
  const maps=CLOUD_DECKS.map(deck=>{
    const cut=probe[Math.min(probe.length-1,
      Math.floor(probe.length*(1-deck.cover)))];
    const data=new Uint8Array(W*H*4);
    for(let j=0;j<H;j++) for(let i=0;i<W;i++){
      const o=(j*W+i)*4;
      data[o]=255; data[o+1]=255; data[o+2]=255;
      data[o+3]= field[j*W+i]>=cut ? rankAlpha[(j&3)*4+(i&3)] : 0;
    }
    const t=new THREE.DataTexture(data,W,H,THREE.RGBAFormat);
    t.magFilter=t.minFilter=THREE.NearestFilter;
    t.generateMipmaps=false;
    t.wrapS=THREE.RepeatWrapping;            // drift wraps round the planet
    t.wrapT=THREE.ClampToEdgeWrapping;
    t.needsUpdate=true;
    return t;
  });
  return {maps,W,H};
}

/* One shell, shared by every deck: the decks differ only in scale, tint and how
   much of the field they keep. */
function buildCloudShell(tiles,px){
  const rad=RADIUS+(ATMO_PX+CLOUD_PX)*px;
  const pos=[],uv=[],nrm=[];
  const TAU=2*Math.PI;
  const lon=n=>Math.atan2(n[2],n[0])/TAU+0.5;
  const lat=n=>0.5+0.5*n[1];                 // equal-area: v tracks sin, not angle

  for(const t of tiles){
    let mid=[0,0,0];
    for(const p of t.corners) mid=V.add(mid,p);
    const nc=V.norm(mid);
    mid=V.mul(nc,rad);
    /* A tile sitting ON the axis has no longitude, and its corners would fan
       across the whole texture. There are one or two such tiles per pole, and
       they take a single flat sample rather than a smear. */
    const polar=Math.hypot(nc[0],nc[2])<Math.sin(t.unitCircum*1.05);
    const u0=lon(nc);
    /* Unwrap against the tile centre so no triangle straddles the u seam. The
       texture repeats in u, so values outside 0..1 sample correctly. */
    const uOf=n=>{
      if(polar) return u0;
      let u=lon(n);
      while(u-u0>0.5) u-=1;
      while(u0-u>0.5) u+=1;
      return u;
    };
    const vOf=n=>polar?lat(nc):lat(n);
    const uc=[u0,lat(nc)];
    for(let k=0;k<t.sides;k++){
      const ca=t.corners[k], cb=t.corners[(k+1)%t.sides];
      const a=V.mul(ca,rad), b=V.mul(cb,rad);
      pos.push(mid[0],mid[1],mid[2], a[0],a[1],a[2], b[0],b[1],b[2]);
      uv.push(uc[0],uc[1], uOf(ca),vOf(ca), uOf(cb),vOf(cb));
      for(let q=0;q<3;q++) nrm.push(nc[0],nc[1],nc[2]);
    }
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  g.setAttribute('normal',new THREE.Float32BufferAttribute(nrm,3));
  g.__radius=rad;
  return g;
}

function buildClouds(tiles,px,seed){
  const sky=cloudSky(seed);
  const geo=buildCloudShell(tiles,px);
  const group=new THREE.Group();
  const decks=CLOUD_DECKS.map((deck,k)=>{
    /* alphaTest, not transparency: it keeps hard pixel edges and correct depth
       in one pass, and it is the knob the see-through effect turns. */
    const mat=new THREE.MeshLambertMaterial({
      map:sky.maps[k], color:new THREE.Color(deck.tone),
      alphaTest:DITHER_FLOOR, transparent:false, opacity:1,
      side:THREE.DoubleSide
    });
    /* The hole has to be decided per FRAGMENT — a uniform opacity can only
       thin the whole deck at once. Injected rather than written from scratch so
       the deck keeps Lambert shading and the alphaTest discard; the multiply
       lands on diffuseColor.a just before that discard, so lowering it inside
       the cap knocks out low dither ranks exactly as opacity used to. */
    mat.onBeforeCompile=sh=>{
      sh.uniforms.uFocus={value:new THREE.Vector3(0,0,1)};
      sh.uniforms.uHoleOut={value:Math.cos(0.7)};
      sh.uniforms.uHoleIn={value:Math.cos(0.3)};
      sh.uniforms.uOpen={value:1};
      sh.vertexShader='varying vec3 vWPos;\n'+sh.vertexShader.replace(
        '#include <begin_vertex>',
        '#include <begin_vertex>\n  vWPos=(modelMatrix*vec4(transformed,1.0)).xyz;');
      sh.fragmentShader=
        'varying vec3 vWPos;\nuniform vec3 uFocus;\nuniform float uHoleOut;\n'+
        'uniform float uHoleIn;\nuniform float uOpen;\n'+
        sh.fragmentShader.replace('#include <alphatest_fragment>',
          '  float _c=dot(normalize(vWPos),uFocus);\n'+
          '  float _h=smoothstep(uHoleOut,uHoleIn,_c);\n'+
          '  diffuseColor.a*=mix(1.0,uOpen,_h);\n'+
          '#include <alphatest_fragment>');
      mat.userData.sh=sh;
    };
    const m=new THREE.Mesh(geo,mat);
    const r=geo.__radius+k*CLOUD_LIFT_PX*px;
    m.scale.setScalar(r/geo.__radius);
    m.renderOrder=k;
    group.add(m);
    return m;
  });
  group.__decks=decks; group.__sky=sky; group.__geo=geo;
  group.tileCount=tiles.length; group.atlas=[sky.W,sky.H];
  return group;
}

/* Drift and see-through, both driven from here so the two never disagree. */
let cloudPhase=0;
function stepSky(dt,dist){
  cloudPhase=(cloudPhase+CLOUD_DRIFT*dt)%1;
  const g=clouds;
  if(!g||!g.__sky) return;
  const W=g.__sky.W;
  // whole-texel steps, so the sky drifts in world pixels like everything else
  const off=Math.round(cloudPhase*W)/W;
  for(const m of g.__sky.maps) m.offset.x=off;
  /* Thin the decks out as the camera closes in, by knocking out dither ranks.
     The cloud opens into a world-pixel screen rather than going evenly
     translucent, and the count of surviving ranks is what the eye reads as the
     strength of the effect. */
  /* The opening widens AND deepens as the camera closes in. Its centre is the
     point of the sphere nearest the camera, which is where the player is
     looking; the planet turns underneath it, so the hole tracks the view
     rather than a patch of ground. */
  const near=Math.max(0,Math.min(1,(SEE_FAR-dist)/(SEE_FAR-SEE_NEAR)));
  const open=1-(1-SEE_MIN)*near;                         // linear: it starts early
  const rad=(HOLE_DEG_FAR+(HOLE_DEG_NEAR-HOLE_DEG_FAR)*near)*Math.PI/180;
  const focus=camera.position.clone().normalize();
  for(const m of g.__decks){
    const sh=m.material.userData.sh;
    if(!sh) continue;                                    // not compiled yet
    sh.uniforms.uFocus.value.copy(focus);
    sh.uniforms.uHoleOut.value=Math.cos(rad);
    sh.uniforms.uHoleIn.value=Math.cos(rad*HOLE_CORE);
    sh.uniforms.uOpen.value=open;
  }
}

/* ============================================================================
   The atmosphere: the same tiling again, ATMO_PX above the land shell, built
   with its winding REVERSED. That single change does all the work — the near
   half of the shell becomes back-facing and is culled, so it never hides the
   planet, while the far half becomes front-facing and shows as a rim beyond
   the planet's silhouette. Unlit, so the tone stays even across the terminator.

   One flat colour now, no texture and no per-facet tint. Seen edge-on in a thin
   ring, a texture only ever shimmered, and the facet variation gave the rim a
   dashed look at small sizes.
   ========================================================================== */
function buildAtmosphere(tiles,px){
  const pos=[],nrm=[];
  const rad=RADIUS+ATMO_PX*px;

  for(const t of tiles){
    let mid=[0,0,0];
    for(const p of t.corners) mid=V.add(mid,p);
    mid=V.mul(mid,rad/t.sides);
    const nn=V.mul(V.norm(mid),-1);        // normals point inward, like the faces

    for(let k=0;k<t.sides;k++){
      const a=V.mul(t.corners[k],rad);
      const b=V.mul(t.corners[(k+1)%t.sides],rad);
      // b before a — this is the inversion
      pos.push(mid[0],mid[1],mid[2], b[0],b[1],b[2], a[0],a[1],a[2]);
      for(let q=0;q<3;q++) nrm.push(nn[0],nn[1],nn[2]);
    }
  }

  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('normal',new THREE.Float32BufferAttribute(nrm,3));
  const air=new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:new THREE.Color(AIR_COLOR)}));
  air.radius=rad;
  return air;
}

/* ============================================================================
   The halo. A flat quad parked behind the planet carrying a radial gradient in
   the atmosphere's own colour, so the air does not simply stop at the rim.
   It lives in the SCENE, not on the planet, so it neither spins nor tilts; and
   because the camera only ever sits on +z looking at the origin, a plane in xy
   always faces it squarely with no billboarding needed.
   ========================================================================== */
function makeGlow(){
  const N=128;
  const cv=document.createElement('canvas');
  cv.width=cv.height=N;
  const ctx=cv.getContext('2d');
  const img=ctx.createImageData(N,N);
  const c=rgb(AIR_COLOR);
  /* The quad is scaled so its edge lands at GLOW_OUT atmosphere radii, which
     puts the rim itself at this fraction of the way out. Flat inside that and
     falling away outside: the flat part is hidden behind the planet and the air,
     so all the gradient is spent where it can actually be seen. */
  const peak=1/GLOW_OUT;
  for(let y=0;y<N;y++) for(let x=0;x<N;x++){
    const dx=(x+0.5)/N*2-1, dy=(y+0.5)/N*2-1;
    const r=Math.hypot(dx,dy);
    let a=0;
    if(r<=peak) a=GLOW_MAX;
    else if(r<1) a=GLOW_MAX*Math.pow((1-r)/(1-peak),1.7);
    const o=(y*N+x)*4;
    img.data[o]=c[0]; img.data[o+1]=c[1]; img.data[o+2]=c[2];
    img.data[o+3]=Math.round(a*255);
  }
  ctx.putImageData(img,0,0);
  const tex=new THREE.CanvasTexture(cv);
  tex.minFilter=tex.magFilter=THREE.LinearFilter;   // a glow, not pixel art
  const m=new THREE.Mesh(
    new THREE.PlaneGeometry(2,2),
    new THREE.MeshBasicMaterial({map:tex,transparent:true,depthWrite:false,
      side:THREE.DoubleSide}));
  m.renderOrder=-1;                                 // behind everything
  return m;
}

/* ============================================================================
   5. SCENE
   ========================================================================== */
const stage=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({antialias:false});
renderer.setClearColor(0x000000,0);
renderer.autoClear=false;
stage.appendChild(renderer.domElement);
const canvas=renderer.domElement;

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(38,1,0.1,50);
let camDist=3.3;

/* ============================================================================
   SPACE  —  drawn as its own orthographic pass before the planet, NOT as a CSS
   backdrop. The canvas renders at 1/pixelScale and is upscaled nearest, so one
   texel of this pass is one world pixel on screen, exactly like the ground; a
   CSS gradient would sit behind that grid and stay smooth while everything in
   front of it stayed chunky.

   Stars are built as quads snapped to the render-pixel lattice rather than
   painted into a texture, so flicker costs a colour-buffer rewrite of a few
   hundred vertices instead of re-uploading the whole backdrop every frame.
   ========================================================================== */
const SKY_CORE = '#0f0c26', SKY_RIM = '#030209';
const STAR_DENSITY  = 0.00085;   // stars per render pixel
const PLUS_SHARE    = 0.13;      // ...of which this many are the 5-pixel plus
/* Across the spectrum, not just blue-white: warm ambers and reds next to cyans
   is what keeps a starfield from reading as grey noise. */
/* The hues are kept but pulled most of the way to white, and pure white is
   weighted in four times over, so the field reads as a white starfield with
   colour in it rather than as confetti. */
const STAR_TONES = ['#ffffff','#ffffff','#ffffff','#ffffff',
                    '#fff8ec','#ffecd0','#ffcebd','#ffdce4','#f6f2ff',
                    '#ece1ff','#d4e2ff','#bff1ff','#c7fae9','#fefecd'];
const ARM_DIM       = 0.50;      // plus arms sit this far below their core
const STAR_INSET    = 0.22;      // shrink each quad inside its own pixel
const FLICKER_SHARE = 0.38;
const FLICKER_MS    = 110;       // stepped, not smooth: it is pixel art
const FLICKER_LEVELS= [1.0,0.82,0.58,0.82];

const bgScene=new THREE.Scene();
const bgCam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
let starCol=null, starList=null;

function buildSpace(W,H){
  while(bgScene.children.length){
    const c=bgScene.children.pop();
    c.geometry.dispose(); c.material.dispose();
  }
  // vignette, as a coarse grid of vertex colours; the low render size does the
  // quantising for us, which is what gives it the banded pixel-art falloff
  const gg=new THREE.PlaneGeometry(2,2,14,14);
  const c0=rgb(SKY_CORE), c1=rgb(SKY_RIM), gc=[];
  const gp=gg.attributes.position;
  for(let i=0;i<gp.count;i++){
    const t=Math.min(1,Math.hypot(gp.getX(i)*0.85,gp.getY(i))/1.25)**1.6;
    for(let k=0;k<3;k++) gc.push((c0[k]+(c1[k]-c0[k])*t)/255);
  }
  gg.setAttribute('color',new THREE.Float32BufferAttribute(gc,3));
  const grad=new THREE.Mesh(gg,new THREE.MeshBasicMaterial({
    vertexColors:true, depthTest:false, depthWrite:false}));
  grad.frustumCulled=false;
  bgScene.add(grad);

  // stars, snapped to whole render pixels
  const px=2/W, py=2/H;
  const pos=[], col=[];
  const tones=STAR_TONES.map(rgb);
  /* Inset inside the pixel rather than spanning it exactly. A quad whose edges
     land ON the lattice rasterises as one pixel or two depending on which side
     of the fill rule the float falls, which is what made the arms come out
     uneven; strictly containing the centre and nothing else is decidable. */
  const cell=(i,j,c)=>{
    if(i<0||j<0||i>=W||j>=H) return 0;
    const x0=(i+STAR_INSET)*px-1, x1=(i+1-STAR_INSET)*px-1;
    const y1=1-(j+STAR_INSET)*py, y0=1-(j+1-STAR_INSET)*py;
    pos.push(x0,y0,0, x1,y0,0, x1,y1,0, x0,y0,0, x1,y1,0, x0,y1,0);
    for(let k=0;k<6;k++) col.push(c[0]/255,c[1]/255,c[2]/255);
    return 1;
  };
  starList=[];
  const n=Math.max(12,Math.round(W*H*STAR_DENSITY));
  for(let s=0;s<n;s++){
    const i=Math.floor(hash3i(s,17,W)*W), j=Math.floor(hash3i(s,29,H)*H);
    const tone=tones[Math.floor(hash3i(s,41,7)*tones.length*0.999)];
    const plus=hash3i(s,53,11)<PLUS_SHARE;
    const start=col.length/3;
    if(!cell(i,j,tone)) continue;          // core clipped: drop the whole star
    let cells=1;
    if(plus){
      const arm=tone.map(v=>Math.round(v*ARM_DIM));
      cells+=cell(i-1,j,arm)+cell(i+1,j,arm)+cell(i,j-1,arm)+cell(i,j+1,arm);
    }
    starList.push({start, count:col.length/3-start, cells, tone, plus,
                   flick:hash3i(s,67,13)<FLICKER_SHARE,
                   phase:hash3i(s,71,19), rate:0.6+hash3i(s,83,23)*1.1});
  }
  const sg=new THREE.BufferGeometry();
  sg.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  starCol=new THREE.Float32BufferAttribute(col,3);
  sg.setAttribute('color',starCol);
  const stars=new THREE.Mesh(sg,new THREE.MeshBasicMaterial({
    vertexColors:true, depthTest:false, depthWrite:false}));
  stars.frustumCulled=false;
  bgScene.add(stars);
}

/* Flicker rewrites only the star colours, and only on a step boundary. */
function stepStars(t){
  if(!starList) return;
  const arr=starCol.array;
  for(const s of starList){
    if(!s.flick) continue;
    const ph=(t*0.001*s.rate+s.phase)%1;
    const lv=FLICKER_LEVELS[Math.floor(ph*FLICKER_LEVELS.length)%FLICKER_LEVELS.length];
    /* v counts VERTICES, and a cell is six of them. Dimming on v===0 left five
       of the core's own vertices at arm brightness, so the centre came out
       mottled and the plus read as a fat blob instead of a cross. */
    for(let v=0;v<s.count;v++){
      const o=(s.start+v)*3;
      const dim=(v/6|0)===0?1:ARM_DIM;
      for(let k=0;k<3;k++) arr[o+k]=s.tone[k]/255*lv*dim;
    }
  }
  starCol.needsUpdate=true;
}

scene.add(new THREE.AmbientLight(0xb9c6ff,0.66));
const sun=new THREE.DirectionalLight(0xfff2d8,0.52);
sun.position.set(1.1,0.9,1.4);
scene.add(sun);

const planet=new THREE.Group();
scene.add(planet);
const glow=makeGlow();
scene.add(glow);

const cliffTex=makeCliffTexture();
const foamTex=makeFoamTexture();
const fieldTex=makeFieldTexture();
let tiles=[], faceTile=[], wallTile=[], mesh=null, walls=null, edges=null,
    air=null, clouds=null, foam=null, fields=null, forest=null,
    houses=null;

/* hover + selection outlines ride along with the planet */
function makeRing(color,scale,width){
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(new Float32Array(21),3));
  const r=new THREE.LineLoop(g,new THREE.LineBasicMaterial({color,linewidth:width}));
  r.visible=false; r.renderOrder=2;
  planet.add(r); return r;
}
const hoverRing=makeRing(0x58c2b0,1,1);

/* ---------------------------------------------------------------------------
   TERRITORY
   A claimed tile is outlined only along edges whose neighbour is NOT claimed,
   so a connected group reads as one shape with a single shared seam inside it.
   The outline is a ribbon inset into the tile by exactly one texture pixel, so
   it stays locked to the 24px art grid at every zoom level and world size.
   ------------------------------------------------------------------------ */
/* How far an outline has to rise to clear whatever is standing on a tile.
   Farmland is 1.5 world px, the tallest tree 10, so a single constant would
   either bury the outline in the crowns or leave it hovering over bare grass. */
function coverLift(t){
  if(t.cover==='forest') return t.texel*(FOREST_TOP_PX+1.5);
  if(t.cover==='houses') return t.texel*(HOUSE_TOP_PX+1.5);
  if(t.cover==='fields') return t.texel*2.4;
  return 0.0016*RADIUS;
}

const TERRITORY_COLOR = 0xf2b45c;
const borderMat=new THREE.MeshBasicMaterial({
  color:TERRITORY_COLOR, side:THREE.DoubleSide,
  polygonOffset:true, polygonOffsetFactor:-2, polygonOffsetUnits:-2
});
const borderMesh=new THREE.Mesh(new THREE.BufferGeometry(),borderMat);
borderMesh.renderOrder=1;
planet.add(borderMesh);

function rebuildBorder(){
  const p=[];
  for(const t of tiles){
    if(t.owner===null) continue;
    // clear of the facet plane, and of anything growing on the tile
    const off=V.mul(t.normal, coverLift(t));
    for(let k=0;k<t.sides;k++){
      const j=t.edgeNeighbors[k];
      if(j>=0 && tiles[j].owner===t.owner) continue;   // shared edge, no outline
      const A=V.add(V.mul(t.corners[k],t.radius),off);
      const B=V.add(V.mul(t.corners[(k+1)%t.sides],t.radius),off);
      const bd=V.norm(V.sub(B,A)), bv=V.sub(t.mid,A);
      const ap=V.len(V.sub(bv,V.mul(bd,V.dot(bv,bd))));    // perpendicular distance
      const s=(ap-t.texel)/ap;                   // this edge's own inset
      const Ai=V.add(t.mid,V.add(V.mul(V.sub(A,t.mid),s),V.mul(off,1-s)));
      const Bi=V.add(t.mid,V.add(V.mul(V.sub(B,t.mid),s),V.mul(off,1-s)));
      p.push(A[0],A[1],A[2], B[0],B[1],B[2], Bi[0],Bi[1],Bi[2]);
      p.push(A[0],A[1],A[2], Bi[0],Bi[1],Bi[2], Ai[0],Ai[1],Ai[2]);
    }
  }
  borderMesh.geometry.dispose();
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));
  borderMesh.geometry=g;
}

/* Claimed tiles also take a warm shift, so a large territory reads at a glance
   without the outline having to carry it alone. */
function paintTile(t){
  const c=mesh.geometry.attributes.color, own=t.owner!==null;
  const r=own?t.tint[0]*1.30:t.tint[0],
        g=own?t.tint[1]*1.00:t.tint[1],
        b=own?t.tint[2]*0.52:t.tint[2];
  for(let k=0;k<t.vertexCount;k++) c.setXYZ(t.vertexStart+k,r,g,b);
  c.needsUpdate=true;
}

/* Raising or lowering a tile changes which walls exist all around it, so the
   whole world mesh is rebuilt. Territory is preserved across the rebuild. */
function toggleTerrain(t){
  t.level = t.level<0 ? 0 : -1;
  if(t.level<0){t.owner=null; t.cover=null;}   // sinking releases claim and cover
  const owners=tiles.map(x=>x.owner);
  const w=active;
  dropMeshes(w);
  // only the flipped tile's cell changes, so repaint that one rather than all
  const frames=computeTileFrames(tiles);
  w.ground.refresh(t);
  const built=buildMesh(tiles,w.ground,cliffTex,foamTex,frames.px);
  w.mesh=mesh=built.mesh; w.walls=walls=built.walls; w.foam=foam=built.foam;
  w.edges=edges=built.edges;
  w.faceTile=faceTile=built.faceTile; w.wallTile=wallTile=built.wallTile;
  planet.add(mesh); planet.add(walls); planet.add(foam); planet.add(edges);
  edges.visible=showEdges;
  tiles.forEach((x,i)=>{x.owner=owners[i]; if(x.owner!==null) paintTile(x);});
  refreshCover();                      // radii moved, so the cover must follow
  rebuildBorder();
  updateStats();
}

function toggleTerritory(t){
  if(t.level<0) return;                // only land can be claimed
  t.owner = t.owner===null ? 0 : null;
  paintTile(t);
  rebuildBorder();
  updateStats();
}

/* ---------------------------------------------------------------------------
   COVER  —  the tile type laid over the ground. Changing one tile reparcels the
   whole zone it belongs to, because the parcels were never per-tile: a new
   neighbour moves the zone's centre, its frame and every cut line inside it.
   Rebuilding the lot is a couple of milliseconds and keeps one code path.
   ------------------------------------------------------------------------ */
function coverMeshes(w){
  const out=[];
  if(w.fields){out.push(w.fields.surface); if(w.fields.posts) out.push(w.fields.posts);}
  if(w.forest){out.push(w.forest.surface);}
  if(w.houses){out.push(w.houses.surface);}
  return out;
}
function addCoverMeshes(w){ for(const m of coverMeshes(w)) planet.add(m); }
function removeCoverMeshes(w){ for(const m of coverMeshes(w)) planet.remove(m); }
function disposeCoverMeshes(w){
  for(const m of coverMeshes(w)){ planet.remove(m); m.geometry.dispose(); }
  w.fields=null; w.forest=null; w.houses=null;
}
function refreshCover(){
  const w=active;
  disposeCoverMeshes(w);
  w.fields=buildFields(tiles,w.px);
  w.forest=buildForest(tiles,w.px,w.seed);
  w.houses=buildHouses(tiles,w.px,w.seed);
  addCoverMeshes(w);
  fields=w.fields; forest=w.forest; houses=w.houses;
}

function toggleCover(t,kind){
  if(t.level<0) return;                // nothing grows on water
  t.cover = t.cover===kind ? null : kind;
  active.ground.repaint([t]);           // houses lay bare earth, so the tile repaints
  refreshCover();
  rebuildBorder();                     // the outline rides at a different height now
  updateStats();
  writeTileLine(t);
}

function clearCover(){
  const wasBuilt=tiles.filter(t=>t.cover==='houses');
  for(const t of tiles) t.cover=null;
  if(wasBuilt.length) active.ground.repaint(wasBuilt);   // give the grass back
  refreshCover();
  rebuildBorder();
  updateStats();
}

function clearTerritory(){
  for(const t of tiles) if(t.owner!==null){t.owner=null;paintTile(t);}
  rebuildBorder();
  updateStats();
}

function setRing(ring,tile){
  if(!tile){ring.visible=false;return;}
  const a=ring.geometry.attributes.position;
  const lift = Math.max(coverLift(tile)*1.15, tile.radius*0.004);
  for(let k=0;k<tile.sides;k++){
    const p=V.mul(tile.corners[k],tile.radius+lift);    // sits on that tile's shell
    a.setXYZ(k,p[0],p[1],p[2]);
  }
  a.needsUpdate=true;
  ring.geometry.setDrawRange(0,tile.sides);
  ring.visible=true;
}

let freq=8, picked=null, hovered=null;

/* Frequency 1 would be the dual of a bare icosahedron: a dodecahedron, all
   pentagons and no hexagons at all. So 2 (42 tiles) is the smallest sphere
   that is still honestly a hex sphere. */
const MIN_F=2, MAX_F=12;
const worlds=new Map();          // n -> built world, kept so the slider never stalls
let active=null;

/* Mean angular step between neighbouring tile centres, expressed as the number
   of tiles a pawn would cross to circle the planet — the scale number that
   actually matters once units start moving. */
function tilesAround(tiles){
  let sum=0,n=0;
  for(const t of tiles) for(const j of t.neighbors){
    if(j<t.id) continue;
    sum+=Math.acos(Math.max(-1,Math.min(1,V.dot(t.center,tiles[j].center))));n++;
  }
  return Math.round(2*Math.PI/(sum/n));
}

function makeWorld(n,seed){
  const tiles=buildHexSphere(n);
  generateTerrain(tiles, seed===undefined ? n*7919 : seed);
  const sd=(seed===undefined?n*7919:seed);
  seedCover(tiles,sd);
  const frames=computeTileFrames(tiles);
  const ground=buildTerrainAtlas(tiles,sd,frames.px);
  const built=buildMesh(tiles,ground,cliffTex,foamTex,frames.px);
  const pent=tiles.filter(t=>t.sides===5).length;
  const w={tiles,ground,mesh:built.mesh,walls:built.walls,foam:built.foam,
           edges:built.edges, air:buildAtmosphere(tiles,frames.px),
           faceTile:built.faceTile,wallTile:built.wallTile,
           fields:buildFields(tiles,frames.px),
           forest:buildForest(tiles,frames.px,sd),
           houses:buildHouses(tiles,frames.px,sd),
           pent,around:tilesAround(tiles),px:frames.px,seed:sd};
  worlds.set(n,w);
  return w;
}

function dropMeshes(w,withAir){
  const list=[w.mesh,w.walls,w.foam,w.edges];
  if(withAir) list.push(w.air);
  for(const m of list){
    if(!m) continue;
    planet.remove(m); m.geometry.dispose();
  }
  /* The decks are a Group with no geometry of its own: they share one shell and
     carry three textures between them, so disposal has to walk into it. */
  if(withAir && w.clouds){
    planet.remove(w.clouds);
    w.clouds.__geo.dispose();      // the three sky textures are shared, so they stay
    w.clouds=undefined;
  }
  if(withAir){
    disposeCoverMeshes(w);
    if(w.ground) w.ground.tex.dispose();
  }
}

/* Reroll the current world's continents. Territory does not survive it. */
function regenTerrain(){
  if(active) dropMeshes(active,true);
  worlds.delete(freq);
  active=null;
  rebuild(freq,Math.floor(Math.random()*1e9));
}

function rebuild(n,seed){
  n=Math.min(MAX_F,Math.max(MIN_F,n|0));
  freq=n;
  const w=worlds.get(n)||makeWorld(n,seed);
  if(active===w) return;
  if(active){
    for(const m of [active.mesh,active.walls,active.foam,active.edges,
                    active.air,active.clouds]) if(m) planet.remove(m);
    removeCoverMeshes(active);
  }
  active=w;
  tiles=w.tiles; mesh=w.mesh; walls=w.walls; foam=w.foam; edges=w.edges; air=w.air;
  faceTile=w.faceTile; wallTile=w.wallTile;
  fields=w.fields; forest=w.forest; houses=w.houses;
  planet.add(mesh); planet.add(walls); planet.add(foam); planet.add(edges);
  planet.add(air);
  addCoverMeshes(w);
  edges.visible=showEdges; air.visible=showAir;

  clouds=w.clouds||null;
  if(clouds){planet.add(clouds); clouds.visible=showClouds;}
  else ensureClouds(w);

  hovered=null; picked=null;
  hoverRing.visible=false;
  rebuildBorder();
  updateStats();
  writeTileLine(null);
}

function updateStats(){
  const w=active, owned=tiles.reduce((s,t)=>s+(t.owner!==null?1:0),0);
  const land=tiles.reduce((s,t)=>s+(t.level===0?1:0),0);
  document.getElementById('s-tiles').textContent=tiles.length;
  document.getElementById('s-mix').textContent=(tiles.length-w.pent)+' / '+w.pent;
  document.getElementById('s-land').textContent=land+' / '+(tiles.length-land);
  document.getElementById('s-around').textContent=w.around;
  document.getElementById('s-terr').textContent=owned;
  const f=w.fields, wd=w.forest, hs=w.houses;
  document.getElementById('s-field').textContent=f?f.tiles:0;
  document.getElementById('s-parcel').textContent=
    f?f.parcels+' / '+f.fences+' fenced':'0';
  document.getElementById('s-wood').textContent=
    wd?wd.tiles+' / '+wd.crowns+' trees':'0';
  document.getElementById('s-town').textContent=
    hs?hs.tiles+' / '+hs.houses+' houses':'0';
}

/* Rasterising a cloud atlas costs a few hundred ms at the larger sizes, which
   would stutter the slider. So it is deferred: the world appears immediately
   and the clouds arrive once the size has settled. Never built during prewarm. */
let cloudJob=null;
function ensureClouds(w){
  if(w.clouds!==undefined) return;
  if(cloudJob) clearTimeout(cloudJob);
  cloudJob=setTimeout(()=>{
    cloudJob=null;
    if(active!==w) return;                 // slider moved on; try again later
    w.clouds=buildClouds(w.tiles,w.px,(w.seed%9973)+7)||null;
    if(w.clouds && active===w){
      clouds=w.clouds; planet.add(clouds); clouds.visible=showClouds;
    }
  },140);
}

/* Build the remaining sizes while the browser is idle, so dragging the slider
   across the full range stays smooth after the first pass. */
function warmWorlds(){
  const idle=window.requestIdleCallback||(f=>setTimeout(()=>f(),150));
  const queue=[];
  for(let n=MIN_F;n<=MAX_F;n++) if(n!==freq) queue.push(n);
  const step=()=>{
    const n=queue.shift();
    if(n===undefined) return;
    if(!worlds.has(n)) makeWorld(n);
    idle(step);
  };
  idle(step);
}

function writeTileLine(t){
  const el=document.getElementById('tileline');
  // cover kinds, as shown in the tile readout
  const COVER={fields:'fields',forest:'forest',houses:'houses'};
  el.innerHTML = t
    ? (t.level<0
        ? `#${t.id} · sea · ${t.sides===5?'pentagon':'hexagon'} · <em>not claimable</em>`
        : `#${t.id} · land · ${t.sides===5?'pentagon':'hexagon'} · `+
          `${t.cover?COVER[t.cover]:'<em>bare</em>'} · ${t.owner!==null?'claimed':'unclaimed'}`)
    : '<em>Click a land tile to claim it</em>';
}

/* ============================================================================
   6. CONTROLS  —  drag to spin, wheel/pinch to zoom, click a tile
   ========================================================================== */
let vel={x:0,y:0}, dragging=false, moved=0;
const pointers=new Map();
let pinchStart=0, camStart=0;
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let drift=false, showEdges=false, showAir=true, showClouds=true,
    pixelScale=3, clickMode='houses';

const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();

function ndcFrom(e){
  const r=canvas.getBoundingClientRect();
  ndc.x=((e.clientX-r.left)/r.width)*2-1;
  ndc.y=-((e.clientY-r.top)/r.height)*2+1;
}
function pickTile(e){
  if(!mesh) return null;
  ndcFrom(e);
  ray.setFromCamera(ndc,camera);
  // cliffs are clickable too, and resolve to the tile on top of them
  const hit=ray.intersectObjects([mesh,walls],false)[0];
  if(!hit) return null;
  return tiles[(hit.object===mesh?faceTile:wallTile)[hit.faceIndex]];
}

/* Spin the planet in camera space so dragging always feels like a trackball. */
function spinBy(dx,dy){
  const right=new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld,0);
  const up   =new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld,1);
  const q=new THREE.Quaternion()
    .setFromAxisAngle(up,dx)
    .multiply(new THREE.Quaternion().setFromAxisAngle(right,dy));
  planet.quaternion.premultiply(q);
}

canvas.addEventListener('pointerdown',e=>{
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===2){
    const [a,b]=[...pointers.values()];
    pinchStart=Math.hypot(a.x-b.x,a.y-b.y); camStart=camDist;
  }
  dragging=true; moved=0; vel={x:0,y:0};
  canvas.classList.add('dragging');
});

canvas.addEventListener('pointermove',e=>{
  const prev=pointers.get(e.pointerId);
  if(prev && dragging){
    const dx=e.clientX-prev.x, dy=e.clientY-prev.y;
    prev.x=e.clientX; prev.y=e.clientY;
    moved+=Math.abs(dx)+Math.abs(dy);

    if(pointers.size===2){
      const [a,b]=[...pointers.values()];
      const d=Math.hypot(a.x-b.x,a.y-b.y);
      if(pinchStart>0) camDist=Math.min(6,Math.max(1.35,camStart*pinchStart/d));
    }else{
      const k=0.0055;
      spinBy(dx*k,dy*k);
      vel={x:dx*k,y:dy*k};
    }
    return;
  }
  if(e.pointerType==='mouse' && !dragging){
    hovered=pickTile(e);
    setRing(hoverRing,hovered);
    writeTileLine(hovered||picked);
  }
});

function endPointer(e){
  if(pointers.size===1 && moved<6){
    const t=pickTile(e);
    if(t){
      if(clickMode==='territory')   toggleTerritory(t);
      else if(clickMode==='terrain') toggleTerrain(t);
      else                           toggleCover(t,clickMode);
    }
    picked=t; writeTileLine(t);
  }
  pointers.delete(e.pointerId);
  if(pointers.size===0){dragging=false;canvas.classList.remove('dragging');}
  pinchStart=0;
}
canvas.addEventListener('pointerup',endPointer);
canvas.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId);dragging=false;canvas.classList.remove('dragging');});
canvas.addEventListener('pointerleave',()=>{if(!dragging){hoverRing.visible=false;writeTileLine(picked);}});

canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  camDist=Math.min(6,Math.max(1.35,camDist*(1+Math.sign(e.deltaY)*0.09)));
},{passive:false});

/* ============================================================================
   7. HUD
   ========================================================================== */
function segment(host,items,current,onPick){
  host.innerHTML='';
  items.forEach(([label,value])=>{
    const b=document.createElement('button');
    b.textContent=label;
    b.dataset.val=String(value);
    b.setAttribute('aria-pressed',String(value===current));
    b.onclick=()=>{
      onPick(value);
      [...host.children].forEach(c=>c.setAttribute('aria-pressed',String(c===b)));
    };
    host.appendChild(b);
  });
}

const slider=document.getElementById('freq');
const freqOut=document.getElementById('freq-out');
let queuedFreq=null;

function labelFor(n){return (10*n*n+2)+' <i>tiles</i>';}

slider.min=MIN_F; slider.max=MAX_F; slider.value=freq;

slider.addEventListener('input',()=>{
  const n=+slider.value;
  freqOut.innerHTML=labelFor(n);        // label tracks the thumb with no delay
  if(queuedFreq===null){                 // heavy rebuild runs at most once a frame
    requestAnimationFrame(()=>{const t=queuedFreq;queuedFreq=null;rebuild(t);});
  }
  queuedFreq=n;
});

segment(document.getElementById('seg-px'),
  [['1×',1],['2×',2],['3×',3],['4×',4]],
  pixelScale, v=>{pixelScale=v;resize();});

segment(document.getElementById('seg-air'),
  [['Off',false],['On',true]],
  showAir, v=>{showAir=v;if(air)air.visible=v;glow.visible=v;});

segment(document.getElementById('seg-cloud'),
  [['Off',false],['On',true]],
  showClouds, v=>{showClouds=v;if(clouds)clouds.visible=v;});

segment(document.getElementById('seg-edge'),
  [['Off',false],['On',true]],
  showEdges, v=>{showEdges=v;if(edges)edges.visible=v;});

segment(document.getElementById('seg-mode'),
  [['Claim','territory'],['Sculpt','terrain'],
   ['Fields','fields'],['Forest','forest'],['Houses','houses']],
  clickMode, v=>setMode(v));

/* The rail and the debug segment are two faces of one setting, so both are
   driven from here rather than each keeping its own idea of the mode. */
const tools=[...document.querySelectorAll('.tool')];
function setMode(v){
  clickMode=v;
  for(const b of tools) b.setAttribute('aria-pressed',String(b.dataset.mode===v));
  const host=document.getElementById('seg-mode');
  for(const c of host.children) c.setAttribute('aria-pressed',String(c.dataset.val===v));
}
for(const b of tools) b.onclick=()=>setMode(b.dataset.mode);
setMode(clickMode);

const dbgBtn=document.getElementById('dbg');
dbgBtn.onclick=()=>{
  const on=!document.body.classList.contains('dbg');
  document.body.classList.toggle('dbg',on);
  dbgBtn.setAttribute('aria-pressed',String(on));
};

document.getElementById('clear').onclick=clearTerritory;
document.getElementById('clear-cover').onclick=clearCover;
document.getElementById('regen').onclick=regenTerrain;

segment(document.getElementById('seg-spin'),
  [['Off',false],['On',true]],
  drift, v=>{drift=v;});

/* ============================================================================
   8. LOOP
   ========================================================================== */
function resize(){
  const w=stage.clientWidth, h=stage.clientHeight;
  camera.aspect=w/h; camera.updateProjectionMatrix();
  renderer.setPixelRatio(1);
  const bw=Math.max(1,Math.round(w/pixelScale)), bh=Math.max(1,Math.round(h/pixelScale));
  renderer.setSize(bw,bh,false);
  canvas.style.width=w+'px'; canvas.style.height=h+'px';
  buildSpace(bw,bh);      // stars are pinned to the render lattice, so rebuild
}
window.addEventListener('resize',resize);

let foamAt=0, foamFrame=0;
let skyAt=performance.now(), starAt=0;
function frame(){
  requestAnimationFrame(frame);

  {
    const now=performance.now();
    const dt=Math.min(0.1,(now-skyAt)/1000);
    skyAt=now;
    // drift stops for reduced motion; the see-through fade still tracks the zoom
    stepSky(reduced?0:dt,camDist);
    // stars step on a coarse clock; smooth twinkling would fight the pixel grid
    if(!reduced && now-starAt>FLICKER_MS){ starAt=now; stepStars(now); }
  }
  if(!reduced){                          // waves cycle at a deliberate 7fps
    const now=performance.now();
    if(now-foamAt>140){
      foamAt=now;
      foamFrame=(foamFrame+1)%FOAM_FRAMES;
      foamTex.offset.y=foamFrame/FOAM_FRAMES;
    }
  }
  if(!dragging){
    if(Math.abs(vel.x)>1e-5||Math.abs(vel.y)>1e-5){
      spinBy(vel.x,vel.y);                 // inertia after a flick
      vel.x*=0.94; vel.y*=0.94;
    }else if(drift){
      spinBy(0.0009,0);                    // slow idle rotation
    }
  }
  camera.position.set(0,0,camDist);
  camera.lookAt(0,0,0);
  /* The halo sits behind the planet, so perspective shrinks it; scaling by the
     ratio of the two distances pins its apparent size to the atmosphere at any
     zoom. Parked far enough back to clear the whole air shell in depth. */
  const ar=air?air.radius:RADIUS;
  const back=ar*GLOW_BACK;
  glow.position.set(0,0,-back);
  const gs=ar*GLOW_OUT*(camDist+back)/camDist;
  glow.scale.set(gs,gs,1);
  // backdrop first, then clear depth so the planet is never occluded by it
  renderer.clear();
  renderer.render(bgScene,bgCam);
  renderer.clearDepth();
  renderer.render(scene,camera);
}

rebuild(freq);
freqOut.innerHTML=labelFor(freq);
resize();
frame();
warmWorlds();

/* Handle for the next build steps: PLANET.tiles carries owner / cover / building
   / capital slots, and PLANET.rebuild(n) reshapes the world. Set t.cover to
   'fields' | 'forest' | 'houses' | null and call PLANET.refreshCover(). */
window.PLANET={get tiles(){return tiles;},rebuild,buildHexSphere,V,
               regenTerrain,refreshCover,clearCover,
               FIELD_CROPS,CANOPY,
               get fields(){return fields;},
               get forest(){return forest;},
               get houses(){return houses;},
               get air(){return air;},
               get clouds(){return clouds;},
               get freq(){return freq;},
               get px(){return active.px;},
               get ground(){return active.ground;},
               get picked(){return picked;}};
</script>
</body>
</html>
