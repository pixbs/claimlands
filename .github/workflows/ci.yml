name: CI

on:
  pull_request:
  push:
    branches: [master]
  merge_group:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# There is deliberately no `dtolnay/rust-toolchain` step anywhere in this repo.
# `rust-toolchain.toml` pins the compiler and lists the components, and
# `rustup toolchain install` with no arguments installs exactly that. Adding an
# action that fetches a *different* toolchain means cargo still uses the pinned
# one while components and targets land on the other — which is how the mobile
# builds first broke ("can't find crate for `std`").

jobs:
  # Gate 1: formatting and lints. Fast, so it runs first and alone.
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features

  # Gates 2, 3, 4: unit tests, golden replays and property tests.
  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  # Gate 5: the same replay must land on the same hash on a different
  # architecture, or future multiplayer would desync between an iPhone and an
  # Android device.
  determinism:
    name: cross-platform determinism
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Verify golden replays
        run: cargo run --release -p lands-cli -- golden verify
      - name: Fuzz the invariants
        # Alternates bounded and wrapping arenas by seed parity, so a closed
        # surface is covered without the workflow having to know.
        run: cargo run --release -p lands-cli -- fuzz --matches 300 --steps 400

  # Gates 6 and 12, plus TODO hygiene.
  repo-rules:
    name: xtask gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask ci

  # Third-party licences, advisories, banned crates.
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # Gate 10: lands-core carries the whole game, so its coverage floor is high.
  coverage:
    name: lands-core coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `llvm-tools` is listed in rust-toolchain.toml, so it arrives with the
      # pinned toolchain rather than needing a separate install.
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Measure
        run: cargo llvm-cov -p lands-core --all-features --fail-under-lines 85
