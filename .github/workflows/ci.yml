name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gate 1: formatting and lints. Fast, so it runs first and alone.
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features

  # Gates 2, 3, 4: unit tests, golden replays and property tests.
  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  # Gate 5: the same replay must land on the same hash on a different
  # architecture, or future multiplayer would desync between an iPhone and an
  # Android device.
  determinism:
    name: cross-platform determinism
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify golden replays
        run: cargo run --release -p civ-cli -- golden verify
      - name: Fuzz the invariants
        run: cargo run --release -p civ-cli -- fuzz --matches 300 --steps 400

  # Gates 6 and 12, plus TODO hygiene.
  repo-rules:
    name: xtask gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask ci

  # Third-party licences, advisories, banned crates.
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # Gate 10: civ-core carries the whole game, so its coverage floor is high.
  coverage:
    name: civ-core coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Measure
        run: cargo llvm-cov -p civ-core --all-features --fail-under-lines 85
