name: Mobile builds

# Gate 9. "It compiles on desktop" is not evidence that it compiles for a
# phone, and finding out at release time is expensive.
#
# Scoped by `paths` so a pull request that only touches the simulation does not
# pay for a twelve-minute NDK build.

on:
  pull_request:
    paths:
      - "crates/civ-ffi/**"
      - "crates/civ-app/**"
      - "crates/civ-render/**"
      - "crates/civ-procgen/**"
      - "platforms/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/mobile.yml"
  merge_group:
  schedule:
    # Once a night regardless, so drift is caught even when nobody touches
    # the paths above.
    - cron: "0 3 * * *"

env:
  CARGO_TERM_COLOR: always

jobs:
  ios:
    name: iOS (aarch64-apple-ios)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - name: Build the static library
        run: |
          cargo build --release -p civ-ffi --target aarch64-apple-ios
          cargo build --release -p civ-ffi --target aarch64-apple-ios-sim

  android:
    name: Android (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - name: Build the shared library
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: cargo ndk -t arm64-v8a -t armeabi-v7a build --release -p civ-ffi

  web:
    name: WebAssembly (CI visual tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build for the browser
        run: cargo build --release -p civ-app --target wasm32-unknown-unknown
