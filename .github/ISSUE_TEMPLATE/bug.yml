name: Bug
description: Something behaves differently from the spec.
title: "fix(scope): "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        The simulation is deterministic, so almost every bug is exactly
        reproducible. Please find the seed — it turns a bug report into a test.

  - type: dropdown
    id: crate
    attributes:
      label: Crate
      options:
        - lands-rules
        - lands-core
        - lands-worldgen
        - lands-ai
        - lands-procgen
        - lands-render
        - lands-levels
        - lands-app
        - lands-ffi
        - platforms
        - tools
        - unknown
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What the spec says
      description: Quote the rule and give its id, or say if the spec is silent.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happens instead
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: >
        A seed, a command log, or a failing golden replay. If you have a seed
        from the fuzzer, paste the command that found it.
      placeholder: |
        cargo run -p lands-cli -- fuzz --matches 5000
        # fails at seed 1183, step 204
      render: shell

  - type: input
    id: rules
    attributes:
      label: Spec rules affected
      placeholder: TERR-030
