name: Feature
description: A unit of work an agent can pick up and finish on its own.
title: "feat(scope): "
labels: ["needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        An issue is a **self-contained brief**. Whoever picks it up will not
        have the conversation that produced it, so everything they need must
        be written down here.

  - type: dropdown
    id: crate
    attributes:
      label: Crate
      description: Which crate does this work live in? One issue, one crate.
      options:
        - lands-rules
        - lands-core
        - lands-worldgen
        - lands-ai
        - lands-procgen
        - lands-render
        - lands-levels
        - lands-app
        - lands-ffi
        - platforms
        - tools
        - spec / docs
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What
      description: What should exist afterwards that does not exist now?
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why
      description: >
        What does this unblock or fix? A reader should be able to tell whether
        the work is still worth doing six weeks from now.
    validations:
      required: true

  - type: input
    id: rules
    attributes:
      label: Spec rules
      description: >
        Rule ids from `spec/rules/` this touches, comma separated (e.g.
        ECON-004, TERR-030). Write "new" if the rule does not exist yet — then
        adding it to the spec is part of the work.
      placeholder: ECON-004, TERR-030
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkable statements, not a description of the approach.
      value: |
        - [ ]
        - [ ] `cargo xtask ci` passes
    validations:
      required: true

  - type: textarea
    id: tests
    attributes:
      label: Tests to add
      description: >
        Which tests must exist before this can merge? Name the golden replay if
        one is needed. Every new rule needs a `covers!(...)` declaration or
        gate 12 will fail.
      placeholder: |
        - Unit test in crates/lands-core/tests/economy.rs covering ECON-0xx
        - Golden replay tests/replays/<name>.ron
    validations:
      required: true

  - type: textarea
    id: preview
    attributes:
      label: What you can see in the preview
      description: >
        What will a reviewer be able to look at once this lands? Every issue
        that produces something spatial or graphical must surface it in the
        WebGPU preview as its own debug panel file — see the registry pattern
        in the app crate. A reviewer opens the per-pull-request preview URL and
        looks.


        Tests prove the numbers are right. They do not prove the planet is
        right: cover scattered evenly and cover properly clumped produce
        identical share statistics, and only one of them is correct.


        Write "not applicable" for work with no spatial or graphical output —
        a trait definition, a file format, CI or tooling. Do not invent a
        contrived panel for those.
      placeholder: |
        A terrain layer colouring land against sea, with the achieved land
        fraction as a readout. Catches continents banding around the equator,
        which no assertion about a quantile would notice.
    validations:
      required: true

  - type: checkboxes
    id: risk
    attributes:
      label: Risk
      options:
        - label: This changes simulation behaviour, so golden replay hashes will move
        - label: This changes balance data
        - label: This adds a new `SeedDomain`
        - label: This changes a crate's public API
